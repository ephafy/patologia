<title id="tfigmezenchymmapa">Mapa kapitoly: mezenchýmové nádory vychádzajú zo spoločnej mezenchýmovej kmeňovej bunky a pomenúvajú sa podľa tkaniva, ktorému sa podobajú. Delia sa na nádory mäkkých tkanív (tuk, väzivo, sval, cievy, neistá diferenciácia), GIST v stene tráviacej rúry a nádory kostí a chrupky. Typ určí biopsia, mikroskop, imunohistochémia a genetika; z typu, gradu FNCLCC a rozsahu TNM vyplýva správanie a liečba</title>
