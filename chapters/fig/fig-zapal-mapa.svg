<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 222" role="img" aria-labelledby="tfigzapalmapa">
<title id="tfigzapalmapa">Mapa kapitoly: zápal ako dej v čase – spúšťač, mediátory, cievna fáza, bunková fáza a ukončenie; z ložiska sa mediátory dostanú do krvi a vyvolajú celkovú odpoveď; zápal skončí rezolúciou, jazvou alebo prejde do chronického</title>
<defs><marker id="mfigzapalmapa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mk"/></marker></defs>

<path class="arwd" d="M8,16 L708,16" marker-end="url(#mfigzapalmapa)"/>
<text class="sub" x="360" y="11" text-anchor="middle">čas: sekundy → minúty → hodiny → dni → týždne</text>

<rect class="bx-c" x="4" y="28" width="128" height="78" rx="3" stroke="var(--color-accent-600)"/>
<text class="lblb" x="68" y="46" text-anchor="middle">spúšťač · 3.1</text>
<text class="sub" x="68" y="64" text-anchor="middle">PAMP mikróbov,</text>
<text class="sub" x="68" y="77" text-anchor="middle">DAMP mŕtvych buniek</text>
<text class="sub" x="68" y="90" text-anchor="middle">→ TLR, inflamazóm</text>

<rect class="bx-k" x="148" y="28" width="128" height="78" rx="3"/>
<text class="lblb" x="212" y="46" text-anchor="middle">mediátory · 3.2</text>
<text class="sub" x="212" y="64" text-anchor="middle">z buniek: histamín,</text>
<text class="sub" x="212" y="77" text-anchor="middle">prostaglandíny, cytokíny</text>
<text class="sub" x="212" y="90" text-anchor="middle">z plazmy: komplement,</text>
<text class="sub" x="212" y="102" text-anchor="middle">kiníny</text>

<rect class="bx-k" x="292" y="28" width="128" height="78" rx="3"/>
<text class="lblb" x="356" y="46" text-anchor="middle">cievna fáza · 3.3</text>
<text class="sub" x="356" y="64" text-anchor="middle">rozšírené arterioly,</text>
<text class="sub" x="356" y="77" text-anchor="middle">netesné venuly</text>
<text class="sub" x="356" y="90" text-anchor="middle">→ exsudát</text>

<rect class="bx-k" x="436" y="28" width="128" height="78" rx="3"/>
<text class="lblb" x="500" y="46" text-anchor="middle">bunková fáza · 3.4</text>
<text class="sub" x="500" y="64" text-anchor="middle">leukocytová kaskáda,</text>
<text class="sub" x="500" y="77" text-anchor="middle">fagocytóza</text>
<text class="sub" x="500" y="90" text-anchor="middle">→ infiltrát</text>

<rect class="bx-m" x="580" y="28" width="132" height="78" rx="3" stroke="var(--color-accent-2-600)" stroke-width="1.5"/>
<text class="lblb" x="646" y="46" text-anchor="middle">ukončenie · 3.5</text>
<text class="sub" x="646" y="64" text-anchor="middle">lipoxíny, rezolvíny,</text>
<text class="sub" x="646" y="77" text-anchor="middle">apoptóza neutrofilov,</text>
<text class="sub" x="646" y="90" text-anchor="middle">eferocytóza</text>

<path class="arw" d="M133,67 L146,67" marker-end="url(#mfigzapalmapa)"/>
<path class="arw" d="M277,67 L290,67" marker-end="url(#mfigzapalmapa)"/>
<path class="arw" d="M421,67 L434,67" marker-end="url(#mfigzapalmapa)"/>
<path class="arw" d="M565,67 L578,67" marker-end="url(#mfigzapalmapa)"/>

<path class="stk-n" d="M592,106 L592,200"/>
<path class="arw" d="M592,134 L608,134" marker-end="url(#mfigzapalmapa)"/>
<path class="arw" d="M592,166 L608,166" marker-end="url(#mfigzapalmapa)"/>
<path class="arw" d="M592,198 L608,198" marker-end="url(#mfigzapalmapa)"/>
<rect class="bx-k" x="610" y="121" width="102" height="26" rx="3"/>
<text class="sub" x="661" y="138" text-anchor="middle">rezolúcia (bez jazvy)</text>
<rect class="bx-k" x="610" y="153" width="102" height="26" rx="3"/>
<text class="sub" x="661" y="170" text-anchor="middle">jazva · kap. 5</text>
<rect class="bx-k" x="610" y="185" width="102" height="26" rx="3"/>
<text class="sub" x="661" y="202" text-anchor="middle">chronický · kap. 5, 6</text>
<text class="sub" x="584" y="138" text-anchor="end">podnet zmizol, kostra tkaniva celá</text>
<text class="sub" x="584" y="170" text-anchor="end">kostra zničená alebo bunky sa nedelia</text>
<text class="sub" x="584" y="202" text-anchor="end">podnet stále pôsobí</text>

<path class="arwd" d="M212,106 L212,134" marker-end="url(#mfigzapalmapa)"/>
<rect class="bx-k" x="148" y="136" width="240" height="72" rx="3"/>
<text class="lblb" x="268" y="154" text-anchor="middle">celková odpoveď · 3.6</text>
<text class="sub" x="268" y="171" text-anchor="middle">TNF-α, IL-1, IL-6 v krvi → horúčka,</text>
<text class="sub" x="268" y="184" text-anchor="middle">CRP, leukocytóza; v nadbytku</text>
<text class="sub" x="268" y="197" text-anchor="middle">SIRS, sepsa, septický šok</text>
<text class="sub" x="220" y="124" text-anchor="start">mediátory v krvi</text>
</svg>
