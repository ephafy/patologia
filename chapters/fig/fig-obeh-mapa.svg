<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 318" role="img" aria-labelledby="tfigobehmapa">
<title id="tfigobehmapa">Mapa kapitoly: v povodí jednej cievy je krvi primálo (trombóza, embólia alebo iná prekážka vedú k ischémii a infarktu), priveľa (aktívna hyperémia alebo venostáza, ktorá môže vyústiť do opuchu a hemoragickej infarzácie), alebo je krv mimo cievy (krvácanie, krvácavé stavy); všetky vetvy spája rovnováha hemostázy</title>
<defs><marker id="mfigobehmapa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mk"/></marker></defs>

<rect class="bx-c" x="216" y="4" width="288" height="30" rx="3" stroke="var(--color-accent-600)"/>
<text class="lblb" x="360" y="24" text-anchor="middle">povodie jednej cievy: čo sa stalo s krvou?</text>

<path class="arw" d="M270,34 L150,56" marker-end="url(#mfigobehmapa)"/>
<path class="arw" d="M400,34 L400,56" marker-end="url(#mfigobehmapa)"/>
<path class="arw" d="M470,34 L610,56" marker-end="url(#mfigobehmapa)"/>

<!-- primálo -->
<rect class="bx-k" x="8" y="58" width="290" height="40" rx="3"/>
<text class="lblb" x="153" y="75" text-anchor="middle">je jej PRIMÁLO</text>
<text class="sub" x="153" y="90" text-anchor="middle">tepna je uzavretá alebo zúžená</text>

<rect class="bx-c" x="8" y="112" width="90" height="52" rx="3"/>
<text class="lblb" x="53" y="131" text-anchor="middle">TROMBÓZA</text>
<text class="sub" x="53" y="146" text-anchor="middle">zrazenina</text>
<text class="sub" x="53" y="158" text-anchor="middle">na mieste · 8.3</text>

<rect class="bx-c" x="108" y="112" width="90" height="52" rx="3"/>
<text class="lblb" x="153" y="131" text-anchor="middle">EMBÓLIA</text>
<text class="sub" x="153" y="146" text-anchor="middle">materiál zanesený</text>
<text class="sub" x="153" y="158" text-anchor="middle">prúdom · 8.4</text>

<rect class="bx-c" x="208" y="112" width="90" height="52" rx="3"/>
<text class="lblb" x="253" y="131" text-anchor="middle">INÁ PREKÁŽKA</text>
<text class="sub" x="253" y="146" text-anchor="middle">stena, tlak zvonka,</text>
<text class="sub" x="253" y="158" text-anchor="middle">krv, sieť · 8.5</text>

<path class="arw" d="M53,98 L53,110" marker-end="url(#mfigobehmapa)"/>
<path class="arw" d="M153,98 L153,110" marker-end="url(#mfigobehmapa)"/>
<path class="arw" d="M253,98 L253,110" marker-end="url(#mfigobehmapa)"/>
<path class="arw" d="M53,164 L120,186" marker-end="url(#mfigobehmapa)"/>
<path class="arw" d="M153,164 L153,186" marker-end="url(#mfigobehmapa)"/>
<path class="arw" d="M253,164 L186,186" marker-end="url(#mfigobehmapa)"/>

<rect class="bx-m" x="58" y="188" width="190" height="52" rx="3" stroke="var(--color-accent-2-600)" stroke-width="1.5"/>
<text class="lblb" x="153" y="207" text-anchor="middle">ISCHÉMIA → INFARKT · 8.6</text>
<text class="sub" x="153" y="222" text-anchor="middle">rozhoduje náhradný prívod, rýchlosť,</text>
<text class="sub" x="153" y="234" text-anchor="middle">citlivosť tkaniva a stav obehu</text>

<!-- priveľa -->
<rect class="bx-k" x="314" y="58" width="172" height="40" rx="3"/>
<text class="lblb" x="400" y="75" text-anchor="middle">je jej PRIVEĽA · 8.7</text>
<text class="sub" x="400" y="90" text-anchor="middle">hyperémia</text>

<rect class="bx-c" x="314" y="112" width="80" height="52" rx="3"/>
<text class="lblb" x="354" y="131" text-anchor="middle">AKTÍVNA</text>
<text class="sub" x="354" y="146" text-anchor="middle">viac priteká</text>
<text class="sub" x="354" y="158" text-anchor="middle">červené, teplé</text>

<rect class="bx-c" x="404" y="112" width="82" height="52" rx="3"/>
<text class="lblb" x="445" y="131" text-anchor="middle">VENOSTÁZA</text>
<text class="sub" x="445" y="146" text-anchor="middle">neodteká</text>
<text class="sub" x="445" y="158" text-anchor="middle">modré, opuch</text>

<path class="arw" d="M354,98 L354,110" marker-end="url(#mfigobehmapa)"/>
<path class="arw" d="M445,98 L445,110" marker-end="url(#mfigobehmapa)"/>
<path class="arw" d="M445,164 L445,186" marker-end="url(#mfigobehmapa)"/>

<rect class="bx-m" x="330" y="188" width="156" height="52" rx="3" stroke="var(--color-accent-2-600)" stroke-width="1.5"/>
<text class="lblb" x="408" y="207" text-anchor="middle">HEMORAGICKÁ</text>
<text class="lblb" x="408" y="221" text-anchor="middle">INFARZÁCIA</text>
<text class="sub" x="408" y="234" text-anchor="middle">úplný uzáver žily ⟳</text>

<!-- mimo cievy -->
<rect class="bx-k" x="502" y="58" width="210" height="40" rx="3"/>
<text class="lblb" x="607" y="75" text-anchor="middle">je MIMO CIEVY</text>
<text class="sub" x="607" y="90" text-anchor="middle">stena praskla, je nahlodaná, prepúšťa</text>

<rect class="bx-c" x="502" y="112" width="210" height="52" rx="3"/>
<text class="lblb" x="607" y="131" text-anchor="middle">KRVÁCANIE · 8.8</text>
<text class="sub" x="607" y="146" text-anchor="middle">do kože, tkaniva, dutín, navonok</text>
<text class="sub" x="607" y="158" text-anchor="middle">množstvo × rýchlosť × miesto</text>

<path class="arw" d="M607,98 L607,110" marker-end="url(#mfigobehmapa)"/>
<path class="arw" d="M607,164 L607,186" marker-end="url(#mfigobehmapa)"/>

<rect class="bx-m" x="502" y="188" width="210" height="52" rx="3" stroke="var(--color-accent-2-600)" stroke-width="1.5"/>
<text class="lblb" x="607" y="207" text-anchor="middle">KRVÁCAVÉ STAVY · 8.9</text>
<text class="sub" x="607" y="222" text-anchor="middle">chýbajú doštičky, koagulačné faktory</text>
<text class="sub" x="607" y="234" text-anchor="middle">alebo pevnosť steny</text>

<!-- hemostáza -->
<rect class="bx-k" x="8" y="262" width="704" height="48" rx="3"/>
<text class="lblb" x="360" y="281" text-anchor="middle">HEMOSTÁZA · 8.2 – spoločná rovnováha</text>
<text class="sub" x="360" y="298" text-anchor="middle">zráža sa priveľa → trombóza    ·    zráža sa primálo → krvácanie    ·    oboje naraz → DIC (8.9.5)</text>
<path class="arwd" d="M153,240 L153,260"/>
<path class="arwd" d="M607,240 L607,260"/>
</svg>
