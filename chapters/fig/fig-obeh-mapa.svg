<text class="sub" x="53" y="146" text-anchor="middle">zrazenina</text>
<text class="sub" x="53" y="158" text-anchor="middle">na mieste</text>
</a>

<a href="#sec-8-4" class="map-link">
<rect class="bx-c" x="108" y="112" width="90" height="52" rx="3"/>
<text class="lblb" x="153" y="131" text-anchor="middle">EMBÓLIA · 8.4</text>
<text class="sub" x="153" y="146" text-anchor="middle">materiál zanesený</text>
<text class="sub" x="153" y="158" text-anchor="middle">prúdom</text>
