<a href="#sec-8-5" class="map-link">
<rect class="bx-c" x="208" y="112" width="90" height="52" rx="3"/>
<text class="lblb" x="253" y="131" text-anchor="middle">PREKÁŽKA · 8.5</text>
<text class="sub" x="253" y="146" text-anchor="middle">v stene, zvonka,</text>
<text class="sub" x="253" y="158" text-anchor="middle">v krvi, v sieti</text>
</a>

<path class="arw" d="M53,98 L53,110" marker-end="url(#mfigobehmapa)"/>
