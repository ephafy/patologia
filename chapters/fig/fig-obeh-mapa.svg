<text class="sub" x="607" y="234" text-anchor="middle">alebo pevnosť steny</text>
</a>

<!-- hemostáza -->
<a href="#sec-8-2" class="map-link">
<rect class="bx-k" x="8" y="262" width="704" height="48" rx="3"/>
