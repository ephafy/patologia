<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-labelledby="tfigtypyzapalu">
<title id="tfigtypyzapalu">Mapa typov zápalu: podľa toho, čo v ložisku prevláda, je zápal alteratívny, exsudatívny alebo proliferatívny; exsudatívny sa ďalej určí podľa toho, čo prešlo stenou cievy, ktoré bunky prišli a či sa pridali hnilobné baktérie</title>
<defs><marker id="mfigtypyzapalu" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mk"/></marker></defs>

<rect class="bx-c" x="240" y="4" width="240" height="28" rx="3" stroke="var(--color-accent-600)"/>
<text class="lblb" x="360" y="22" text-anchor="middle">Čo v ložisku prevláda?</text>
<path class="arw" d="M300,32 L90,58" marker-end="url(#mfigtypyzapalu)"/>
<path class="arw" d="M360,32 L360,58" marker-end="url(#mfigtypyzapalu)"/>
<path class="arw" d="M420,32 L630,58" marker-end="url(#mfigtypyzapalu)"/>

<rect class="bx-k" x="4" y="60" width="172" height="44" rx="3"/>
<text class="lblb" x="90" y="78" text-anchor="middle">zánik buniek</text>
<text class="sub" x="90" y="94" text-anchor="middle">alteratívny · 4.2</text>
<text class="sub" x="90" y="124" text-anchor="middle">toxín alebo vírus zabije</text>
<text class="sub" x="90" y="137" text-anchor="middle">bunky skôr, než príde obrana</text>

<rect class="bx-m" x="190" y="60" width="340" height="44" rx="3" stroke="var(--color-accent-2-600)" stroke-width="1.5"/>
<text class="lblb" x="360" y="78" text-anchor="middle">tekutina a bunky z ciev (exsudát)</text>
<text class="sub" x="360" y="94" text-anchor="middle">exsudatívny · 4.3–4.8</text>

<rect class="bx-k" x="544" y="60" width="172" height="44" rx="3"/>
<text class="lblb" x="630" y="78" text-anchor="middle">nové bunky v ložisku</text>
<text class="sub" x="630" y="94" text-anchor="middle">proliferatívny · kap. 5, 7</text>
<text class="sub" x="630" y="124" text-anchor="middle">podnet trvá → granulačné</text>
<text class="sub" x="630" y="137" text-anchor="middle">tkanivo, fibróza, granulóm</text>

<path class="arw" d="M244,104 L244,118" marker-end="url(#mfigtypyzapalu)"/>
<path class="arw" d="M360,104 L360,118" marker-end="url(#mfigtypyzapalu)"/>
<path class="arw" d="M476,104 L476,118" marker-end="url(#mfigtypyzapalu)"/>
<rect class="bx-c" x="190" y="120" width="108" height="26" rx="3" stroke="var(--color-accent-600)"/>
<text class="lblb" x="244" y="137" text-anchor="middle">čo prešlo stenou?</text>
<rect class="bx-c" x="306" y="120" width="108" height="26" rx="3" stroke="var(--color-accent-600)"/>
<text class="lblb" x="360" y="137" text-anchor="middle">kto prišiel?</text>
<rect class="bx-c" x="422" y="120" width="108" height="26" rx="3" stroke="var(--color-accent-600)"/>
<text class="lblb" x="476" y="137" text-anchor="middle">čo sa pridalo?</text>

<rect class="bx-k" x="190" y="158" width="108" height="32" rx="3"/>
<text class="sub" x="244" y="171" text-anchor="middle">voda, albumín</text>
<text class="sub" x="244" y="184" text-anchor="middle">→ serózny · 4.3</text>
<rect class="bx-k" x="190" y="196" width="108" height="32" rx="3"/>
<text class="sub" x="244" y="209" text-anchor="middle">+ fibrinogén</text>
<text class="sub" x="244" y="222" text-anchor="middle">→ fibrinózny · 4.6</text>
<rect class="bx-k" x="190" y="234" width="108" height="32" rx="3"/>
<text class="sub" x="244" y="247" text-anchor="middle">+ erytrocyty</text>
<text class="sub" x="244" y="260" text-anchor="middle">→ hemoragický · 4.7</text>
<path class="arwd" d="M182,160 L182,264" marker-end="url(#mfigtypyzapalu)"/>
<text class="sub" x="176" y="200" text-anchor="end">čím ťažšie</text>
<text class="sub" x="176" y="213" text-anchor="end">poškodená</text>
<text class="sub" x="176" y="226" text-anchor="end">cieva</text>

<rect class="bx-k" x="306" y="158" width="108" height="32" rx="3"/>
<text class="sub" x="360" y="171" text-anchor="middle">lymfocyty</text>
<text class="sub" x="360" y="184" text-anchor="middle">→ lymfocytárny · 4.4</text>
<rect class="bx-k" x="306" y="196" width="108" height="32" rx="3"/>
<text class="sub" x="360" y="209" text-anchor="middle">neutrofily</text>
<text class="sub" x="360" y="222" text-anchor="middle">→ hnisavý · 4.5</text>

<rect class="bx-k" x="422" y="158" width="108" height="32" rx="3"/>
<text class="sub" x="476" y="171" text-anchor="middle">hnilobné baktérie</text>
<text class="sub" x="476" y="184" text-anchor="middle">→ gangrenózny · 4.8</text>

<text class="sub" x="360" y="290" text-anchor="middle">Osi sa kombinujú: napr. fibrinózno-hnisavá peritonitída, serofibrinózna pleuritída.</text>
</svg>
