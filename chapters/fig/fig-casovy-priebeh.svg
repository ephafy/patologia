<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 270" role="img" aria-labelledby="t12">
<title id="t12">Časová os ischémie myokardu: kedy zlyhá funkcia, kedy bunky odumrú a od kedy to zachytí laboratórium, mikroskop a voľné oko</title>
<defs><marker id="a12" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mk"/></marker></defs>

<!-- časová os (nelineárna) -->
<path class="arw" d="M150,40 L682,40" marker-end="url(#a12)"/>
<g class="sub" text-anchor="middle">
<text x="160" y="30">0</text><text x="230" y="30">1–2 min</text><text x="310" y="30">20–40 min</text>
<text x="400" y="30">hodiny</text><text x="490" y="30">4–12 h</text><text x="580" y="30">12–24 h</text><text x="660" y="30">dni</text>
</g>
<g class="s-t" stroke-width="1"><path d="M160,40 V238"/><path d="M230,40 V238"/><path d="M310,40 V238"/><path d="M490,40 V238"/><path d="M580,40 V238"/></g>

<!-- reverzibilné / ireverzibilné pozadie -->
<rect class="f-c" x="160" y="46" width="150" height="192"/>
<rect class="f-m" x="310" y="46" width="372" height="192"/>
<text class="lbl-c" x="235" y="60" text-anchor="middle">ešte vratné</text>
<text class="lbl-m" x="496" y="60" text-anchor="middle">bunky za bodom nezvratnosti</text>

<!-- riadky -->
<text class="lblb" x="140" y="88" text-anchor="end">kontrakcia</text>
<path class="s-c" stroke-width="6" d="M160,84 L230,84"/>
<text class="sub" x="238" y="88">ustane</text>

<text class="lblb" x="140" y="120" text-anchor="end">elektrónový mikroskop</text>
<path class="s-k" stroke-width="6" d="M310,116 L682,116"/>
<text class="sub" x="318" y="108">prasknuté membrány, denzné telieska v mitochondriách</text>

<text class="lblb" x="140" y="152" text-anchor="end">troponín v krvi</text>
<path class="s-m" stroke-width="6" d="M400,148 L682,148"/>
<text class="sub" x="408" y="140">unikne cez poškodenú membránu</text>

<text class="lblb" x="140" y="184" text-anchor="end">svetelný mikroskop</text>
<path class="s-m" stroke-width="6" d="M490,180 L682,180"/>
<text class="sub" x="498" y="172">koagulačná nekróza</text>

<text class="lblb" x="140" y="216" text-anchor="end">voľné oko</text>
<path class="s-m" stroke-width="6" d="M580,212 L682,212"/>
<text class="sub" x="588" y="204">škvrnité ložisko</text>

<text class="sub" x="160" y="258">Os nie je lineárna. Kto zomrie do niekoľkých hodín, má srdce makroskopicky normálne – nekróza sa hľadá mikroskopicky.</text>
</svg>
