.akt{fill:none;stroke:var(--sch-akt);stroke-width:1.4;stroke-dasharray:5 3.5}
.inh{fill:none;stroke:var(--sch-inh);stroke-width:1.4;stroke-dasharray:5 3.5}
.vz{fill:none;stroke:var(--color-neutral-600);stroke-width:1.3;stroke-dasharray:5 3.5}
.akt.plna,.inh.plna,.vz.plna{stroke-dasharray:none}
.t-akt{font-size:10px;font-weight:600;fill:var(--sch-akt)}
.t-inh{font-size:10px;font-weight:600;fill:var(--sch-inh)}
.mk-nv{fill:var(--color-neutral-900)}
.mk-n{fill:var(--color-neutral-600)}
.mk-akt{fill:var(--sch-akt)}
.mk-koe{fill:var(--sch-koe-s)}
.mk-inh{fill:none;stroke:var(--sch-inh);stroke-width:2.2}
.komp{fill:var(--color-neutral-100);stroke:var(--color-neutral-400);stroke-width:1;stroke-dasharray:2 3}
.komp-m{fill:var(--color-accent-100);stroke:var(--color-accent-400);stroke-width:1.2}
.rk,.rk-a{cursor:pointer;outline:none}
.rk-hit{fill:transparent;stroke:transparent;stroke-width:14;pointer-events:all}
.rk-b circle{fill:var(--color-accent-600);stroke:#fff;stroke-width:1.3}
.rk-b path{fill:none;stroke:#fff;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.rk-b.rk-l circle{fill:var(--color-neutral-700)}
.rk.is-open>.rk-b .rk-v{display:none}
.rk.is-open>.rk-b circle{fill:var(--color-accent-800)}
.rk:hover>.rk-b circle,.rk:focus-visible>.rk-b circle{fill:var(--color-accent-800)}
.rk-a:hover>.rk-b circle,.rk-a:focus-visible>.rk-b circle{fill:var(--color-neutral-900)}
.rk:hover>rect:not(.rk-hit),.rk-a:hover>rect:not(.rk-hit),.rk:focus-visible>rect:not(.rk-hit),.rk-a:focus-visible>rect:not(.rk-hit),.rk.is-open>rect:not(.rk-hit){stroke:var(--color-accent-600);stroke-width:1.4}
.rk:hover>.rk-hit,.rk-a:hover>.rk-hit,.rk:focus-visible>.rk-hit,.rk-a:focus-visible>.rk-hit{fill:var(--color-accent-100)}
.rk-panel{display:none}
.rk-panel.is-open{display:inline}
.rk-bg{fill:var(--color-neutral-100)}
.rk-line{fill:none;stroke:var(--color-accent-600);stroke-width:1.5}
.rk-t{font-size:10.5px;font-weight:600;letter-spacing:.02em;fill:var(--color-accent-800)}
.rk-x circle{fill:#fff;stroke:var(--color-neutral-400);stroke-width:1}
.rk-x path{fill:none;stroke:var(--color-neutral-700);stroke-width:1.5;stroke-linecap:round}
.rk-x:hover circle,.rk-x:focus-visible circle{stroke:var(--color-accent-600);fill:var(--color-accent-100)}
.rk-n{font-size:9.5px;fill:var(--color-neutral-800)}
.rk-n b,.rk-n .b{font-weight:600}
a[href]{cursor:pointer}
a[href] rect{transition:stroke-width .15s, filter .15s}
a[href]:hover rect,a[href]:focus-visible rect{stroke-width:2.2;filter:brightness(.96)}
a[href]:focus-visible{outline:none}
