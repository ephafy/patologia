<title id="tfignadorymapa">Mapa kapitoly: kancerogény a vnútorné faktory poškodia DNA, v bunke sa zapnú onkogény a vypnú supresorové a opravné gény, zmeny sa hromadia v čase od iniciácie cez promóciu po progresiu a vznikne nádor, ktorý sa pomenuje podľa tkaniva pôvodu; nepravý nádor ho len napodobní a prevencia so skríningom zasahujú do príčin aj do priebehu</title>
<defs><marker id="mfignadorymapa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mk"/></marker></defs>

<!-- riadok 1: prečo nádor vzniká (stĺpce 30–230, 300–500, 570–770; medzera 70) -->
<text class="cap" x="30" y="14">PREČO NÁDOR VZNIKÁ</text>

<a href="#sec-10-7" class="map-link">
<rect class="bx-c" x="30" y="22" width="200" height="74" rx="3"/>
<text class="lblb" x="130" y="40" text-anchor="middle">ČO TO SPÚŠŤA · 10.7</text>
<text class="sub" x="130" y="56" text-anchor="middle">kancerogény: chemické,</text>
<text class="sub" x="130" y="69" text-anchor="middle">fyzikálne, biologické</text>
<text class="sub" x="130" y="82" text-anchor="middle">vnútorné: vek, hormóny, dedičnosť</text>
</a>

<a href="#sec-10-5" class="map-link">
<rect class="bx-c" x="300" y="22" width="200" height="74" rx="3"/>
<text class="lblb" x="400" y="40" text-anchor="middle">ČO SA POKAZÍ V BUNKE · 10.5</text>
<text class="sub" x="400" y="56" text-anchor="middle">onkogény zapnuté (1 alela)</text>
<text class="sub" x="400" y="69" text-anchor="middle">supresory vypnuté (obe alely)</text>
<text class="sub" x="400" y="82" text-anchor="middle">opravy DNA vypnuté → nestabilita</text>
</a>

<a href="#sec-10-6" class="map-link">
<rect class="bx-c" x="570" y="22" width="200" height="74" rx="3"/>
<text class="lblb" x="670" y="40" text-anchor="middle">AKO TO POSTUPUJE · 10.6</text>
<text class="sub" x="670" y="56" text-anchor="middle">iniciácia → promócia → progresia</text>
<text class="sub" x="670" y="69" text-anchor="middle">roky až desaťročia</text>
<text class="sub" x="670" y="82" text-anchor="middle">na konci: znaky nádoru</text>
</a>

<text class="sub" x="265" y="53" text-anchor="middle">poškodí DNA</text>
<path class="arw" d="M232,63 L298,63" marker-end="url(#mfignadorymapa)"/>
<text class="sub" x="535" y="41" text-anchor="middle">zmeny sa</text>
<text class="sub" x="535" y="53" text-anchor="middle">hromadia</text>
<path class="arw" d="M502,63 L568,63" marker-end="url(#mfignadorymapa)"/>

<!-- z progresie vznikne nádor: dolu, doľava, dolu -->
<path class="arw" d="M670,98 L670,118 L400,118 L400,140" marker-end="url(#mfignadorymapa)"/>
<text class="sub" x="535" y="112" text-anchor="middle">výsledok</text>

<!-- riadok 2: čo nádor je -->
<text class="cap" x="30" y="136">ČO NÁDOR JE</text>

<a href="#sec-10-3" class="map-link">
<rect class="bx-k" x="30" y="144" width="200" height="62" rx="3"/>
<text class="lblb" x="130" y="163" text-anchor="middle">NEPRAVÝ NÁDOR · 10.3</text>
<text class="sub" x="130" y="179" text-anchor="middle">hmota bez autonómneho rastu:</text>
<text class="sub" x="130" y="193" text-anchor="middle">zápal, hyperplázia, cysta, hamartóm</text>
</a>

<a href="#sec-10-2" class="map-link">
<rect class="bx-k" x="300" y="144" width="200" height="62" rx="3" stroke="var(--color-accent-600)"/>
<text class="lblb" x="400" y="163" text-anchor="middle">NÁDOR · 10.2</text>
<text class="sub" x="400" y="179" text-anchor="middle">rast bez regulácie, aj bez podnetu</text>
<text class="sub" x="400" y="193" text-anchor="middle">jeden klon, ktorý sa rozrôzni</text>
</a>

<a href="#sec-10-4" class="map-link">
<rect class="bx-c" x="570" y="144" width="200" height="62" rx="3"/>
<text class="lblb" x="670" y="163" text-anchor="middle">AKO SA VOLÁ · 10.4</text>
<text class="sub" x="670" y="179" text-anchor="middle">podľa tkaniva pôvodu</text>
<text class="sub" x="670" y="193" text-anchor="middle">parenchým určí typ, stróma nesie</text>
</a>

<text class="sub" x="265" y="165" text-anchor="middle">napodobní</text>
<path class="arwd" d="M232,175 L298,175" marker-end="url(#mfignadorymapa)"/>
<text class="sub" x="535" y="165" text-anchor="middle">pomenuje sa</text>
<path class="arw" d="M502,175 L568,175" marker-end="url(#mfignadorymapa)"/>

<!-- riadok 3: kde sa dá zasiahnuť; prerušované čiary idú po okrajoch, mimo blokov -->
<text class="cap" x="30" y="236">KDE SA DÁ ZASIAHNUŤ</text>

<a href="#sec-10-8" class="map-link">
<rect class="bx-k" x="250" y="244" width="300" height="50" rx="3"/>
<text class="lblb" x="400" y="263" text-anchor="middle">PREVENCIA A SKRÍNING · 10.8</text>
<text class="sub" x="400" y="280" text-anchor="middle">odstrániť príčinu · zachytiť zmenu, kým je vratná</text>
</a>
<path class="arwd" d="M248,269 L12,269 L12,59 L28,59" marker-end="url(#mfignadorymapa)"/>
<path class="arwd" d="M552,269 L788,269 L788,59 L772,59" marker-end="url(#mfignadorymapa)"/>

<text class="sub" x="400" y="318" text-anchor="middle">nezhubný × zhubný nádor, stupeň, rozsah a šírenie → kap. 11</text>
</svg>
