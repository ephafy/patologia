<style data-standalone="1">
svg{--color-bg:#f3f2f2;--color-surface:#eae9e9;--color-text:#201e1d;--color-accent:#0088b0;--color-accent-2:#d6006c;--color-divider:color-mix(in srgb,#201e1d 16%,transparent);--color-neutral-100:#f8f4f4;--color-neutral-200:#eae7e7;--color-neutral-300:#d7d3d3;--color-neutral-400:#bab6b6;--color-neutral-500:#9b9797;--color-neutral-600:#7d7979;--color-neutral-700:#605d5d;--color-neutral-800:#444141;--color-neutral-900:#2d2b2b;--color-accent-100:#e9f8ff;--color-accent-200:#cbeeff;--color-accent-300:#99e0ff;--color-accent-400:#62c5ee;--color-accent-500:#38a6cf;--color-accent-600:#1186ac;--color-accent-700:#006786;--color-accent-800:#004961;--color-accent-900:#0a303e;--color-accent-2-100:#fff1f4;--color-accent-2-200:#ffdee6;--color-accent-2-300:#ffc0d0;--color-accent-2-400:#ff90b1;--color-accent-2-500:#ff458e;--color-accent-2-600:#d82071;--color-accent-2-700:#aa0b56;--color-accent-2-800:#790e3d;--color-accent-2-900:#4b1528;--color-process-yellow:#edbb00;--font-heading:"Source Serif 4",system-ui,serif;--font-heading-weight:600;--font-body:"Source Serif 4",system-ui,serif;--font-mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;--space-1:5px;--space-2:10px;--space-3:15px;--space-4:20px;--space-6:30px;--space-8:40px;--radius-sm:1px;--radius-md:2px;--radius-lg:4px;--shadow-sm:0 1px 2px color-mix(in srgb,#2d2b2b 14%,transparent);--shadow-md:0 3px 10px color-mix(in srgb,#2d2b2b 16%,transparent);--shadow-lg:0 12px 32px color-mix(in srgb,#2d2b2b 22%,transparent);--color-accent:#5f42a8;--color-accent-2:#cf4a72;--color-accent-100:#f4f0fc;--color-accent-200:#e5dcf6;--color-accent-300:#cdbdec;--color-accent-400:#ae95df;--color-accent-500:#8c6dcd;--color-accent-600:#7350b8;--color-accent-700:#5a3d9a;--color-accent-800:#412b70;--color-accent-900:#291b47;--color-accent-2-100:#fdf0f3;--color-accent-2-200:#fadde5;--color-accent-2-300:#f5bccb;--color-accent-2-400:#ee92ab;--color-accent-2-500:#e3698b;--color-accent-2-600:#cf4a72;--color-accent-2-700:#a93659;--color-accent-2-800:#7c2842;-