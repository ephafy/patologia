<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 414" role="img" aria-labelledby="t51">
<title id="t51">Mapa granulomatóznych zápalov: vodorovne sila imunity T-lymfocytov, zvislo odolnosť a toxicita pôvodcu pre makrofág; každá choroba leží na inom mieste a tomu zodpovedá jej obraz</title>
<defs><marker id="a51" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mk"/></marker></defs>

<!-- osi -->
<path class="arw" d="M90,350 L700,350" marker-end="url(#a51)"/>
<path class="arw" d="M90,350 L90,24" marker-end="url(#a51)"/>
<text class="lblb" x="700" y="374" text-anchor="end">imunita T-lymfocytov (Th1, IFN-γ) →</text>
<text class="sub" x="96" y="374">žiadna / zlyhaná</text>
<text class="lblb" x="78" y="30" text-anchor="end" transform="rotate(-90 78 30)">← odolnosť a toxicita agens pre makrofág</text>

<!-- zóny -->
<rect class="f-m" x="96" y="30" width="250" height="150"/>
<rect class="f-c" x="400" y="30" width="296" height="150"/>
<rect class="bx-k" x="96" y="200" width="250" height="144" rx="2"/>
<rect class="bx-k" x="400" y="200" width="296" height="144" rx="2"/>

<!-- vľavo hore: agens odolné, imunita slabá -->
<text class="lblb" x="110" y="52">bez granulómu – plachty makrofágov</text>
<text class="sub" x="110" y="70">baktérie sa množia v makrofágoch</text>
<text class="sub" x="110" y="96">• lepromatózna lepra (Virchowove bunky)</text>
<text class="sub" x="110" y="112">• atypické mykobaktérie pri AIDS</text>
<text class="sub" x="110" y="128">• TBC pri ťažkej imunodeficiencii:</text>
<text class="sub" x="122" y="142">exsudácia, miliárny rozsev, málo granulómov</text>
<text class="sub" x="110" y="166">výsledok: rozsev, veľa baktérií</text>

<!-- vpravo hore: agens odolné, imunita silná -->
<text class="lblb" x="414" y="52">granulóm s NEKRÓZOU</text>
<text class="sub" x="414" y="70">T-lymfocyty zabíjajú aj infikované tkanivo</text>
<text class="sub" x="414" y="96">• tuberkulóza – kazeifikácia</text>
<text class="sub" x="414" y="112">• tuberkuloidná lepra – ničí nervy</text>
<text class="sub" x="414" y="128">• histoplazmóza, kokcidioidomykóza</text>
<text class="sub" x="414" y="144">• + neutrofily: hnisavý granulóm (bartonela)</text>
<text class="sub" x="414" y="166">výsledok: ohraničenie za cenu jazvy</text>

<!-- vľavo dole: agens inertné, bez T-lymfocytov -->
<text class="lblb" x="110" y="222">granulóm z CUDZÍCH TELIES</text>
<text class="sub" x="110" y="240">makrofágy splývajú okolo materiálu</text>
<text class="sub" x="110" y="266">• steh, mastenec, keratín</text>
<text class="sub" x="110" y="282">• kryštály kyseliny močovej (dnavý tofus)</text>
<text class="sub" x="110" y="298">• cholesterol, silikón</text>
<text class="sub" x="110" y="324">výsledok: pomalý obrat, väzivové puzdro</text>

<!-- vpravo dole: agens neškodné/neznáme, imunita prehnaná -->
<text class="lblb" x="414" y="222">granulóm BEZ NEKRÓZY</text>
<text class="sub" x="414" y="240">prehnaná Th1 odpoveď na slabý antigén</text>
<text class="sub" x="414" y="266">• sarkoidóza</text>
<text class="sub" x="414" y="282">• berýlióza, reakcia po očkovaní BCG</text>
<text class="sub" x="414" y="298">• Crohnova choroba (čiastočne)</text>
<text class="sub" x="414" y="324">výsledok: vstrebe sa, alebo fibróza</text>

<text class="sub" x="96" y="394">Rovnaký pôvodca sa po mape posúva s imunitou pacienta:</text>
<text class="sub" x="96" y="408">TBC u zdravého dospelého je vpravo hore, u pacienta s AIDS vľavo hore.</text>
</svg>
