<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 290" role="img" aria-labelledby="tmfigkruhhypertrofia">
<title id="tmfigkruhhypertrofia">Bludný kruh preťaženej ľavej komory: napätie steny vyvolá hypertrofiu kardiomyocytov, väčší sval spotrebuje viac kyslíka než mu dodajú kapiláry, ischémia vedie k zániku buniek a fibróze, komora sa rozšíri a napätie steny ďalej rastie; bod zvratu nastáva, keď rast kapilár prestane stačiť rastu svalu</title>
<defs><marker id="mfigkruhhypertrofia" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mk"/></marker></defs>
<rect class="bx-c" x="30" y="0" width="170" height="26" rx="3" stroke="var(--color-accent-600)"/>
<text class="lblb" x="115" y="17" text-anchor="middle">tlakové preťaženie</text>
<path class="arw" d="M115,26 L115,42" marker-end="url(#mfigkruhhypertrofia)"/>
<rect class="bx-k" x="20" y="44" width="190" height="50" rx="3"/>
<text class="lblb" x="115" y="66" text-anchor="middle">napätie steny ↑ →</text>
<text class="lblb" x="115" y="80" text-anchor="middle">hypertrofia kardiomyocytov</text>
<rect class="bx-k" x="490" y="44" width="190" height="50" rx="3"/>
<text class="lblb" x="585" y="66" text-anchor="middle">spotreba O₂ ↑,</text>
<text class="lblb" x="585" y="80" text-anchor="middle">kapilár pribúda pomalšie</text>
<rect class="bx-k" x="490" y="194" width="190" height="50" rx="3"/>
<text class="lblb" x="585" y="216" text-anchor="middle">ischémia → zánik buniek,</text>
<text class="lblb" x="585" y="230" text-anchor="middle">fibróza medzi vláknami</text>
<rect class="bx-m" x="20" y="194" width="190" height="50" rx="3" stroke="var(--color-accent-2-600)" stroke-width="1.5"/>
<text class="lblb" x="115" y="216" text-anchor="middle">menej svalu, tuhšia stena:</text>
<text class="lblb" x="115" y="230" text-anchor="middle">komora sa rozširuje</text>
<path class="arw" d="M212,69 L488,69" marker-end="url(#mfigkruhhypertrofia)"/>
<path class="arw" d="M585,96 L585,192" marker-end="url(#mfigkruhhypertrofia)"/>
<path class="arw" d="M488,219 L212,219" marker-end="url(#mfigkruhhypertrofia)"/>
<path class="arw" d="M115,192 L115,96" marker-end="url(#mfigkruhhypertrofia)" style="stroke-width:2.2"/>
<text class="sub" x="350" y="63" text-anchor="middle">hrubšia stena, ten istý počet buniek</text>
<text class="sub" x="577" y="148" text-anchor="end">dlhšia cesta kyslíka</text>
<text class="sub" x="577" y="161" text-anchor="end">do stredu hrubého vlákna</text>
<text class="sub" x="350" y="213" text-anchor="middle">zvyšné bunky nesú celú záťaž</text>
<text class="sub" x="123" y="148" text-anchor="start">väčší polomer dutiny</text>
<text class="sub" x="123" y="161" text-anchor="start">→ napätie steny ďalej ↑</text>
<text x="350" y="146" text-anchor="middle" style="font-size:26px;fill:var(--color-accent-2-600)">⟳</text>
<text class="cap" x="350" y="162" text-anchor="middle">circulus vitiosus</text>
<text class="lbl-m" x="585" y="262" text-anchor="middle">bod zvratu: kapiláry nestačia svalu</text>
<text class="sub" x="585" y="278" text-anchor="middle">(od neho hypertrofia škodí)</text>
</svg>
