<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 306" role="img" aria-labelledby="tfigadaptaciamapa">
<style data-standalone="1">
svg{--color-bg:#f3f2f2;--color-surface:#eae9e9;--color-text:#201e1d;--color-accent:#0088b0;--color-accent-2:#d6006c;--color-divider:color-mix(in srgb,#201e1d 16%,transparent);--color-neutral-100:#f8f4f4;--color-neutral-200:#eae7e7;--color-neutral-300:#d7d3d3;--color-neutral-400:#bab6b6;--color-neutral-500:#9b9797;--color-neutral-600:#7d7979;--color-neutral-700:#605d5d;--color-neutral-800:#444141;--color-neutral-900:#2d2b2b;--color-accent-100:#e9f8ff;--color-accent-200:#cbeeff;--color-accent-300:#99e0ff;--color-accent-400:#62c5ee;--color-accent-500:#38a6cf;--color-accent-600:#1186ac;--color-accent-700:#006786;--color-accent-800:#004961;--color-accent-900:#0a303e;--color-accent-2-100:#fff1f4;--color-accent-2-200:#ffdee6;--color-accent-2-300:#ffc0d0;--color-accent-2-400:#ff90b1;--color-accent-2-500:#ff458e;--color-accent-2-600:#d82071;--color-accent-2-700:#aa0b56;--color-accent-2-800:#790e3d;--color-accent-2-900:#4b1528;--color-process-yellow:#edbb00;--font-heading:"Source Serif 4",system-ui,serif;--font-heading-weight:600;--font-body:"Source Serif 4",system-ui,serif;--font-mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;--space-1:5px;--space-2:10px;--space-3:15px;--space-4:20px;--space-6:30px;--space-8:40px;--radius-sm:1px;--radius-md:2px;--radius-lg:4px;--shadow-sm:0 1px 2px color-mix(in srgb,#2d2b2b 14%,transparent);--shadow-md:0 3px 10px color-mix(in srgb,#2d2b2b 16%,transparent);--shadow-lg:0 12px 32px color-mix(in srgb,#2d2b2b 22%,transparent);--color-accent:#5f42a8;--color-accent-2:#cf4a72;--color-accent-100:#f4f0fc;--color-accent-200:#e5dcf6;--color-accent-300:#cdbdec;--color-accent-400:#ae95df;--color-accent-500:#8c6dcd;--color-accent-600:#7350b8;--color-accent-700:#5a3d9a;--color-accent-800:#412b70;--color-accent-900:#291b47;--color-accent-2-100:#fdf0f3;--color-accent-2-200:#fadde5;--color-accent-2-300:#f5bccb;--color-accent-2-400:#ee92ab;--color-accent-2-500:#e3698b;--color-accent-2-600:#cf4a72;--color-accent-2-700:#a93659;--color-accent-2-800:#7c2842;--color-accent-2-900:#4a1727;--site-accent:#5f42a8;--site-accent-2:#cf4a72;font-family:"Source Serif 4",Georgia,serif}
svg{margin:12px 0;break-inside:avoid;max-width:700px}
svg{width:100%;height:auto;display:block;font-family:var(--font-body)}
.ax{stroke:var(--color-neutral-400);stroke-width:1}
.grid{stroke:var(--color-neutral-300);stroke-width:1;stroke-dasharray:2 3}
.ser{fill:none;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.s-c{stroke:var(--color-accent)}
.s-m{stroke:var(--color-accent-2)}
.s-k{stroke:var(--color-neutral-700)}
.f-c{fill:var(--color-accent);opacity:.13}
.f-m{fill:var(--color-accent-2);opacity:.13}
.band-c{fill:var(--color-accent-100)}
.band-m{fill:var(--color-accent-2-100)}
.tick{font-size:9.5px;fill:var(--color-neutral-600);font-variant-numeric:tabular-nums}
.lbl{font-size:10.5px;fill:var(--color-neutral-800)}
.lbl-c{font-size:10.5px;fill:var(--color-accent-700)}
.lbl-m{font-size:10.5px;fill:var(--color-accent-2-700)}
.cap{font-size:9.5px;fill:var(--color-neutral-600);letter-spacing:.08em;text-transform:uppercase}
.mark{stroke:var(--color-neutral-800);stroke-width:1;stroke-dasharray:3 3}
.bar-c{fill:var(--color-accent-500)}
.bar-m{fill:var(--color-accent-2-500)}
.bx{fill:var(--color-neutral-200)}
.bx-c{fill:var(--color-accent-200)}
.bx-m{fill:var(--color-accent-2-200)}
.bx-k{fill:var(--color-neutral-100);stroke:var(--color-neutral-400)}
.mk{fill:var(--color-neutral-700)}
.arw{fill:none;stroke:var(--color-neutral-700);stroke-width:1.5}
.arwd{fill:none;stroke:var(--color-neutral-600);stroke-width:1.3;stroke-dasharray:5 4}
.cell{fill:var(--color-accent-100);stroke:var(--color-accent-600);stroke-width:1.5}
.nuc{fill:var(--color-accent-400);stroke:var(--color-accent-800);stroke-width:1}
.cellm{fill:var(--color-accent-2-100);stroke:var(--color-accent-2-600);stroke-width:1.5}
.nucm{fill:var(--color-accent-2-500);stroke:var(--color-accent-2-800);stroke-width:1}
.dot{fill:var(--color-neutral-700)}
.dotm{fill:var(--color-accent-2-600)}
.lblb{font-size:11px;font-weight:600;fill:var(--color-neutral-900)}
.sub{font-size:9.5px;fill:var(--color-neutral-700)}
.zone-r{fill:var(--color-accent-2-100)}
.zone-i{fill:var(--color-accent-100)}
.s-d{stroke:var(--color-neutral-700);stroke-dasharray:6 4}
.s-t{stroke:var(--color-neutral-700);stroke-dasharray:2 4}
.fill-acc{fill:var(--color-accent-500)}
.fill-acc2{fill:var(--color-accent-2-500)}
.stk-acc{fill:none;stroke:var(--color-accent-600);stroke-width:2}
.stk-acc2{fill:none;stroke:var(--color-accent-2-600);stroke-width:2}
.stk-n{fill:none;stroke:var(--color-neutral-600);stroke-width:1.3}
svg{--sch-koe:#fae28c;--sch-koe-s:#c2940a;--sch-akt:#1f7d38;--sch-inh:#cd2b26}
.bd{fill:none;stroke:var(--color-neutral-900);stroke-width:1.25;stroke-linecap:round}
.bd.bb{stroke-width:3.6;stroke-linecap:butt}
.wg{fill:var(--color-neutral-900);stroke:var(--color-neutral-900);stroke-width:.5;stroke-linejoin:round}
.at{font-size:10.5px;fill:var(--color-neutral-900)}
.at .ix{font-size:7.4px}
.pc{fill:#fff;stroke:var(--color-neutral-900);stroke-width:1.1}
.at.pt{font-size:9px;font-weight:600}
.nm{font-size:7px;fill:var(--color-neutral-600)}
.bd.hl{stroke:var(--color-accent-600);stroke-width:1.7}
.bd.bb.hl{stroke-width:3.6}
.wg.hl{fill:var(--color-accent-600);stroke:var(--color-accent-600)}
.at.hl{fill:var(--color-accent-700);font-weight:600}
.pc.hl{fill:var(--color-accent-100);stroke:var(--color-accent-600);stroke-width:1.5}
.bd.hl2{stroke:var(--color-accent-2-600);stroke-width:1.7}
.bd.bb.hl2{stroke-width:3.6}
.wg.hl2{fill:var(--color-accent-2-600);stroke:var(--color-accent-2-600)}
.at.hl2{fill:var(--color-accent-2-700);font-weight:600}
.pc.hl2{fill:var(--color-accent-2-100);stroke:var(--color-accent-2-600);stroke-width:1.5}
.t-zv{font-size:10.5px;font-weight:700;fill:var(--color-accent-700)}
.t-zv2{font-size:10.5px;font-weight:700;fill:var(--color-accent-2-700)}
.mk-zv{fill:var(--color-accent-500)}
.zv-s{fill:none;stroke:var(--color-accent-500);stroke-width:1.2}
.zv2-s{fill:none;stroke:var(--color-accent-2-500);stroke-width:1.2}
.halo{fill:none;stroke:#fff;stroke-width:5.5;stroke-linecap:butt}
text.lem,.lem text{paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round}
.br-zv{fill:none;stroke:var(--color-accent-600);stroke-width:1.3}
.br-zv2{fill:none;stroke:var(--color-accent-2-600);stroke-width:1.3}
.mk-zv2{fill:var(--color-accent-2-500)}
.mn{font-size:10.5px;font-weight:600;fill:var(--color-neutral-900)}
.ms{font-size:9px;fill:var(--color-neutral-700)}
.rx{fill:none;stroke:var(--color-neutral-800);stroke-width:1.5}
.rx.nv{stroke:var(--color-neutral-900);stroke-width:2.8}
.enz{font-size:10px;font-style:italic;fill:var(--color-accent-700)}
.enz .kr{font-style:normal;font-weight:600;fill:var(--color-neutral-900)}
.koe{fill:var(--sch-koe);stroke:var(--sch-koe-s);stroke-width:.8}
.koet{font-size:9.5px;font-weight:600;fill:#3a2d00}
.koa{fill:none;stroke:var(--sch-koe-s);stroke-width:1.3}
.akt{fill:none;stroke:var(--sch-akt);stroke-width:1.4;stroke-dasharray:5 3.5}
.inh{fill:none;stroke:var(--sch-inh);stroke-width:1.4;stroke-dasharray:5 3.5}
.vz{fill:none;stroke:var(--color-neutral-600);stroke-width:1.3;stroke-dasharray:5 3.5}
.akt.plna,.inh.plna,.vz.plna{stroke-dasharray:none}
.t-akt{font-size:10px;font-weight:600;fill:var(--sch-akt)}
.t-inh{font-size:10px;font-weight:600;fill:var(--sch-inh)}
.mk-nv{fill:var(--color-neutral-900)}
.mk-n{fill:var(--color-neutral-600)}
.mk-akt{fill:var(--sch-akt)}
.mk-koe{fill:var(--sch-koe-s)}
.mk-inh{fill:none;stroke:var(--sch-inh);stroke-width:2.2}
.komp{fill:var(--color-neutral-100);stroke:var(--color-neutral-400);stroke-width:1;stroke-dasharray:2 3}
.komp-m{fill:var(--color-accent-100);stroke:var(--color-accent-400);stroke-width:1.2}
.rk,.rk-a{cursor:pointer;outline:none}
.rk-hit{fill:transparent;stroke:transparent;stroke-width:14;pointer-events:all}
.rk-b circle{fill:var(--color-accent-600);stroke:#fff;stroke-width:1.3}
.rk-b path{fill:none;stroke:#fff;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.rk-b.rk-l circle{fill:var(--color-neutral-700)}
.rk.is-open>.rk-b .rk-v{display:none}
.rk.is-open>.rk-b circle{fill:var(--color-accent-800)}
.rk:hover>.rk-b circle,.rk:focus-visible>.rk-b circle{fill:var(--color-accent-800)}
.rk-a:hover>.rk-b circle,.rk-a:focus-visible>.rk-b circle{fill:var(--color-neutral-900)}
.rk:hover>rect:not(.rk-hit),.rk-a:hover>rect:not(.rk-hit),.rk:focus-visible>rect:not(.rk-hit),.rk-a:focus-visible>rect:not(.rk-hit),.rk.is-open>rect:not(.rk-hit){stroke:var(--color-accent-600);stroke-width:1.4}
.rk:hover>.rk-hit,.rk-a:hover>.rk-hit,.rk:focus-visible>.rk-hit,.rk-a:focus-visible>.rk-hit{fill:var(--color-accent-100)}
.rk-panel{display:none}
.rk-panel.is-open{display:inline}
.rk-bg{fill:var(--color-neutral-100)}
.rk-line{fill:none;stroke:var(--color-accent-600);stroke-width:1.5}
.rk-t{font-size:10.5px;font-weight:600;letter-spacing:.02em;fill:var(--color-accent-800)}
.rk-x circle{fill:#fff;stroke:var(--color-neutral-400);stroke-width:1}
.rk-x path{fill:none;stroke:var(--color-neutral-700);stroke-width:1.5;stroke-linecap:round}
.rk-x:hover circle,.rk-x:focus-visible circle{stroke:var(--color-accent-600);fill:var(--color-accent-100)}
.rk-n{font-size:9.5px;fill:var(--color-neutral-800)}
.rk-n b,.rk-n .b{font-weight:600}
a[href]{cursor:pointer}
a[href] rect{transition:stroke-width .15s, filter .15s}
a[href]:hover rect,a[href]:focus-visible rect{stroke-width:2.2;filter:brightness(.96)}
a[href]:focus-visible{outline:none}
</style>
<title id="tfigadaptaciamapa">Mapa kapitoly: trvalá záťaž, ktorú bunka prežije, vedie podľa toho, čo od tkaniva žiada, k hypertrofii alebo hyperplázii (viac práce), k metaplázii (zmenené prostredie) alebo k atrofii (menej práce); keď podnet zmizne, zmena ustúpi, keď trvá, rezerva sa vyčerpá</title>
<defs><marker id="mfigadaptaciamapa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mk"/></marker></defs>

<rect class="bx-c" x="226" y="4" width="268" height="30" rx="3" stroke="var(--color-accent-600)"/>
<text class="lblb" x="360" y="24" text-anchor="middle">trvalá záťaž, ktorú bunka prežije</text>

<path class="arw" d="M300,34 L160,58" marker-end="url(#mfigadaptaciamapa)"/>
<path class="arw" d="M410,34 L410,58" marker-end="url(#mfigadaptaciamapa)"/>
<path class="arw" d="M470,34 L612,58" marker-end="url(#mfigadaptaciamapa)"/>

<!-- čo záťaž žiada -->
<rect class="bx-k" x="8" y="60" width="292" height="46" rx="3"/>
<text class="lblb" x="154" y="79" text-anchor="middle">žiada VIAC PRÁCE alebo dáva viac signálu</text>
<text class="sub" x="154" y="96" text-anchor="middle">tlak, objem, hormón, rastový faktor</text>

<rect class="bx-k" x="316" y="60" width="188" height="46" rx="3"/>
<text class="lblb" x="410" y="79" text-anchor="middle">mení PROSTREDIE</text>
<text class="sub" x="410" y="96" text-anchor="middle">dym, kyselina, kameň, zápal</text>

<rect class="bx-k" x="520" y="60" width="192" height="46" rx="3"/>
<text class="lblb" x="616" y="79" text-anchor="middle">žiada MENEJ</text>
<text class="sub" x="616" y="96" text-anchor="middle">nečinnosť, hlad, málo krvi</text>

<path class="arw" d="M78,106 L78,132" marker-end="url(#mfigadaptaciamapa)"/>
<path class="arw" d="M230,106 L230,132" marker-end="url(#mfigadaptaciamapa)"/>
<path class="arw" d="M410,106 L410,132" marker-end="url(#mfigadaptaciamapa)"/>
<path class="arw" d="M616,106 L616,132" marker-end="url(#mfigadaptaciamapa)"/>
<text class="sub" x="84" y="123" text-anchor="start">bunky sa nedelia</text>
<text class="sub" x="236" y="123" text-anchor="start">delia sa</text>

<!-- odpoveď -->
<rect class="bx-c" x="8" y="134" width="140" height="84" rx="3"/>
<text class="lblb" x="78" y="153" text-anchor="middle">HYPERTROFIA · 6.2</text>
<text class="sub" x="78" y="171" text-anchor="middle">väčšie bunky</text>
<text class="sub" x="78" y="191" text-anchor="middle">myokard,</text>
<text class="sub" x="78" y="205" text-anchor="middle">kostrový sval</text>

<rect class="bx-c" x="160" y="134" width="140" height="84" rx="3"/>
<text class="lblb" x="230" y="153" text-anchor="middle">HYPERPLÁZIA · 6.3</text>
<text class="sub" x="230" y="171" text-anchor="middle">viac buniek</text>
<text class="sub" x="230" y="191" text-anchor="middle">endometrium, prostata,</text>
<text class="sub" x="230" y="205" text-anchor="middle">štítna žľaza</text>

<rect class="bx-c" x="316" y="134" width="188" height="84" rx="3"/>
<text class="lblb" x="410" y="153" text-anchor="middle">METAPLÁZIA · 6.4</text>
<text class="sub" x="410" y="171" text-anchor="middle">iný, odolnejší typ buniek</text>
<text class="sub" x="410" y="191" text-anchor="middle">priedušky fajčiara,</text>
<text class="sub" x="410" y="205" text-anchor="middle">pažerák pri refluxe, žalúdok</text>

<rect class="bx-k" x="520" y="134" width="192" height="84" rx="3"/>
<text class="lblb" x="616" y="153" text-anchor="middle">ATROFIA · kap. 1.2</text>
<text class="sub" x="616" y="171" text-anchor="middle">menšie alebo menej buniek</text>
<text class="sub" x="616" y="191" text-anchor="middle">sval v sadre,</text>
<text class="sub" x="616" y="205" text-anchor="middle">oblička za zúženou tepnou</text>

<text class="sub" x="88" y="234" text-anchor="start">často spolu (maternica v gravidite)</text>

<!-- osud -->
<path class="stk-n" d="M78,218 L78,246 L616,246 L616,218"/>
<path class="stk-n" d="M410,218 L410,246"/>
<path class="stk-n" d="M230,218 L230,224"/>
<path class="arw" d="M200,246 L200,262" marker-end="url(#mfigadaptaciamapa)"/>
<path class="arw" d="M520,246 L520,262" marker-end="url(#mfigadaptaciamapa)"/>

<rect class="bx-k" x="60" y="264" width="280" height="38" rx="3"/>
<text class="lblb" x="200" y="280" text-anchor="middle">podnet zmizne</text>
<text class="sub" x="200" y="295" text-anchor="middle">→ tkanivo sa vráti k pôvodnému stavu</text>

<rect class="bx-m" x="372" y="264" width="296" height="38" rx="3" stroke="var(--color-accent-2-600)" stroke-width="1.5"/>
<text class="lblb" x="520" y="280" text-anchor="middle">podnet trvá · 6.6</text>
<text class="sub" x="520" y="295" text-anchor="middle">→ zlyhanie orgánu alebo dysplázia a nádor</text>
</svg>
