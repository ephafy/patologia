<title id="tmfigkruhsepsa">Bludný kruh sepsy: cytokíny rozšíria a uvoľnia cievy v celom tele, klesne tlak, orgány sú zle prekrvené a upchaté mikrotrombami, rozpadnuté bunky uvoľnia DAMP a tie vyplavia ďalšie cytokíny</title>
