<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 316" role="img" aria-labelledby="tfigkruhdic">
<title id="tfigkruhdic">Bludný kruh DIC: tkanivový faktor v krvi a poškodený endotel spustia tvorbu trombínu v celom obehu, vznikajú fibrínové mikrotromby, ischémia orgánov poškodí bunky a endotel, ktoré uvoľnia ďalší tkanivový faktor; mikrotromby zároveň spotrebujú doštičky, fibrinogén a faktory, takže pacient krváca; bod zvratu je vyčerpanie bŕzd a zásob</title>
<defs><marker id="mfigkruhdic" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mk"/></marker></defs>
<rect class="bx-c" x="20" y="0" width="190" height="26" rx="3" stroke="var(--color-accent-600)"/>
<text class="lblb" x="115" y="17" text-anchor="middle">sepsa, pôrod, úraz, nádor, šok</text>
<path class="arw" d="M115,26 L115,42" marker-end="url(#mfigkruhdic)"/>
<rect class="bx-k" x="20" y="44" width="190" height="50" rx="3"/>
<text class="lblb" x="115" y="66" text-anchor="middle">tkanivový faktor v krvi,</text>
<text class="lblb" x="115" y="80" text-anchor="middle">poškodený endotel</text>
<rect class="bx-k" x="490" y="44" width="190" height="50" rx="3"/>
<text class="lblb" x="585" y="66" text-anchor="middle">trombín vzniká</text>
<text class="lblb" x="585" y="80" text-anchor="middle">v celom obehu naraz</text>
<rect class="bx-k" x="490" y="194" width="190" height="50" rx="3"/>
<text class="lblb" x="585" y="216" text-anchor="middle">fibrínové mikrotromby</text>
<text class="lblb" x="585" y="230" text-anchor="middle">v kapilárach a arteriolách</text>
<rect class="bx-k" x="20" y="194" width="190" height="50" rx="3"/>
<text class="lblb" x="115" y="216" text-anchor="middle">ischémia orgánov,</text>
<text class="lblb" x="115" y="230" text-anchor="middle">odumierajúce bunky</text>
<path class="arw" d="M212,69 L488,69" marker-end="url(#mfigkruhdic)"/>
<path class="arw" d="M585,96 L585,192" marker-end="url(#mfigkruhdic)"/>
<path class="arw" d="M488,219 L212,219" marker-end="url(#mfigkruhdic)"/>
<path class="arw" d="M115,192 L115,96" marker-end="url(#mfigkruhdic)" style="stroke-width:2.2"/>
<text class="sub" x="350" y="63" text-anchor="middle">antitrombín a proteín C sa vyčerpajú</text>
<text class="sub" x="577" y="141" text-anchor="end">trombín mení</text>
<text class="sub" x="577" y="154" text-anchor="end">fibrinogén na fibrín</text>
<text class="sub" x="350" y="213" text-anchor="middle">upchatá mikrocirkulácia</text>
<text class="sub" x="123" y="141" text-anchor="start">uvoľnia ďalší</text>
<text class="sub" x="123" y="154" text-anchor="start">tkanivový faktor</text>
<text x="350" y="140" text-anchor="middle" style="font-size:26px;fill:var(--color-accent-2-600)">⟳</text>
<text class="cap" x="350" y="156" text-anchor="middle">circulus vitiosus</text>
<path class="arw" d="M585,244 L585,266" marker-end="url(#mfigkruhdic)"/>
<rect class="bx-m" x="400" y="268" width="290" height="44" rx="3" stroke="var(--color-accent-2-600)" stroke-width="1.5"/>
<text class="lblb" x="545" y="286" text-anchor="middle">spotreba doštičiek, fibrinogénu a faktorov</text>
<text class="lblb" x="545" y="302" text-anchor="middle">→ KRVÁCANIE</text>
<text class="lbl-m" x="115" y="270" text-anchor="middle">bod zvratu: brzdy a zásoby sú vyčerpané</text>
<text class="sub" x="115" y="286" text-anchor="middle">(trombóza a krvácanie naraz,</text>
<text class="sub" x="115" y="299" text-anchor="middle">orgány zlyhávajú)</text>
</svg>
