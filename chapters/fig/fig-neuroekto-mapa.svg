<text class="sub" x="879.2" y="259.5" text-anchor="middle">NET × NEC</text>
<text class="sub" x="879.2" y="273.2" text-anchor="middle">MiNEN</text>
<text class="sub" x="879.2" y="286.9" text-anchor="middle">funkčné syndrómy</text>
</a>
