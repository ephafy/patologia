<title id="tfigneuroektomapa">Mapa kapitoly: z neuroektodermu vzniká nervová trubica a nervová lišta. Z lišty pochádzajú Schwannove bunky (schwannóm, neurofibróm, MPNST), sympatikové neuroblasty (neuroblastóm až ganglioneuróm), chromafinné bunky (feochromocytóm, paraganglióm) a melanocyty (névus, melanóm); z trubice glia a neuróny CNS (gliómy, meduloblastóm; meningióm z obalov). Neuroendokrinné bunky epitelu sú z endodermu, ale majú rovnaký neuroendokrinný program – z nich vznikajú NET, NEC a MiNEN</title>
<defs><marker id="mfigneuroektomapa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mk"/></marker></defs>
<text class="cap" x="480" y="18.8" text-anchor="middle">Kde sa bunka v zárodku usadila, tam vzniká jej nádor</text>
<a href="#sec-14-1" class="map-link">
<rect class="bx-c" x="315" y="30.7" width="330" height="59.6" rx="3"/>
<text class="lblb" x="480" y="48.7" text-anchor="middle">NEUROEKTODERM · 14.1</text>
<text class="sub" x="480" y="64.7" text-anchor="middle">nervová platnička → žliabok → trubica a lišta</text>
<text class="sub" x="480" y="78.4" text-anchor="middle">spoločné črty nádorov: línia, zrelosť, funkcia · 14.2</text>
</a>
<rect class="bx-k" x="13" y="124.3" width="560" height="59.6" rx="3" stroke="var(--color-accent-600)"/>
<text class="lblb" x="293" y="149.1" text-anchor="middle">NERVOVÁ LIŠTA</text>
<text class="sub" x="293" y="165.2" text-anchor="middle">bunky putujú telom a usadia sa v nervoch, gangliách, nadobličke, koži</text>
<rect class="bx-k" x="595" y="124.3" width="160" height="59.6" rx="3" stroke="var(--color-accent-600)"/>
<text class="lblb" x="675" y="142.3" text-anchor="middle">NERVOVÁ TRUBICA</text>
<text class="sub" x="675" y="158.3" text-anchor="middle">mozog a miecha</text>
<text class="sub" x="675" y="172" text-anchor="middle">ostáva v lebke</text>
<rect class="bx-k" x="777" y="124.3" width="170" height="59.6" rx="3" stroke="var(--color-accent-2-600)"/>
<text class="lblb" x="862" y="142.3" text-anchor="middle">ENDODERM</text>
<text class="sub" x="862" y="158.3" text-anchor="middle">NE bunky epitelu</text>
<text class="sub" x="862" y="172" text-anchor="middle">rovnaký program</text>
<a href="#sec-14-3" class="map-link">
<rect class="bx-m" x="12" y="217.9" width="137.7" height="88.5" rx="3"/>
<text class="lblb" x="80.8" y="242.7" text-anchor="middle">NEUROBLAST ·</text>
<text class="lblb" x="80.8" y="257.8" text-anchor="middle">14.3</text>
<text class="sub" x="80.8" y="273.9" text-anchor="middle">neuroblastóm</text>
<text class="sub" x="80.8" y="287.6" text-anchor="middle">→ ganglioneuróm</text>
</a>
<a href="#sec-14-4" class="map-link">
<rect class="bx-m" x="171.7" y="217.9" width="137.7" height="88.5" rx="3"/>
<text class="lblb" x="240.5" y="242.7" text-anchor="middle">CHROMAFINNÁ ·</text>
<text class="lblb" x="240.5" y="257.8" text-anchor="middle">14.4</text>
<text class="sub" x="240.5" y="273.9" text-anchor="middle">feochromocytóm</text>
<text class="sub" x="240.5" y="287.6" text-anchor="middle">paraganglióm</text>
</a>
<a href="#sec-14-5" class="map-link">
<rect class="bx-m" x="331.3" y="217.9" width="137.7" height="88.5" rx="3"/>
<text class="lblb" x="400.2" y="235.9" text-anchor="middle">SCHWANNOVA B. ·</text>
<text class="lblb" x="400.2" y="251" text-anchor="middle">14.5</text>
<text class="sub" x="400.2" y="267" text-anchor="middle">schwannóm</text>
<text class="sub" x="400.2" y="280.8" text-anchor="middle">neurofibróm, MPNST</text>
<text class="sub" x="400.2" y="294.5" text-anchor="middle">syndrómy NF · 14.6</text>
</a>
<a href="#sec-14-8" class="map-link">
<rect class="bx-m" x="491" y="217.9" width="137.7" height="88.5" rx="3"/>
