<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 262" role="img" aria-labelledby="tfigleukkaskada">
<title id="tfigleukkaskada">Leukocytová kaskáda: leukocyt sa v spomalenej krvi vysunie k stene venuly, kotúľa sa po selektínoch, pevne sa prichytí integrínmi, pretiahne sa medzi endotelovými bunkami a v tkanive putuje za chemoatraktantmi k baktériám</title>
<defs><marker id="mfigleukkaskada" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mk"/></marker></defs>

<!-- lúmen venuly -->
<rect class="zone-r" x="0" y="34" width="720" height="92"/>
<text class="sub" x="8" y="48">lúmen postkapilárnej venuly – krv spomalená exsudáciou</text>
<path class="arwd" d="M8,62 L60,62" marker-end="url(#mfigleukkaskada)"/>

<!-- endotel -->
<rect class="cell" x="0" y="126" width="118" height="12" rx="5"/>
<rect class="cell" x="122" y="126" width="118" height="12" rx="5"/>
<rect class="cell" x="244" y="126" width="118" height="12" rx="5"/>
<rect class="cell" x="366" y="126" width="74" height="12" rx="5"/>
<rect class="cell" x="476" y="126" width="118" height="12" rx="5"/>
<rect class="cell" x="598" y="126" width="122" height="12" rx="5"/>
<text class="sub" x="712" y="122" text-anchor="end">endotel</text>

<!-- tkanivo -->
<rect class="zone-i" x="0" y="140" width="720" height="100"/>
<text class="sub" x="8" y="234">tkanivo (interstícium)</text>

<!-- 1 marginácia -->
<circle class="cellm" cx="70" cy="84" r="14"/><circle class="nucm" cx="70" cy="84" r="6"/>
<path class="arw" d="M70,100 L70,112" marker-end="url(#mfigleukkaskada)"/>
<text class="lblb" x="70" y="16" text-anchor="middle">1. marginácia</text>
<text class="sub" x="70" y="28" text-anchor="middle">k okraju prúdu</text>

<!-- 2 rolling -->
<circle class="cellm" cx="190" cy="111" r="14"/><circle class="nucm" cx="190" cy="111" r="6"/>
<path class="arw" d="M176,90 Q190,78 204,90" marker-end="url(#mfigleukkaskada)"/>
<text class="lblb" x="190" y="16" text-anchor="middle">2. rolling</text>
<text class="sub" x="190" y="28" text-anchor="middle">selektíny – slabá väzba</text>

<!-- 3 adhézia -->
<ellipse class="cellm" cx="310" cy="115" rx="19" ry="10"/><ellipse class="nucm" cx="310" cy="115" rx="8" ry="4"/>
<text class="lblb" x="310" y="16" text-anchor="middle">3. adhézia</text>
<text class="sub" x="310" y="28" text-anchor="middle">integríny – ICAM-1</text>

<!-- 4 diapedéza -->
<ellipse class="cellm" cx="458" cy="132" rx="10" ry="20"/><ellipse class="nucm" cx="458" cy="132" rx="4" ry="8"/>
<text class="lblb" x="458" y="16" text-anchor="middle">4. diapedéza</text>
<text class="sub" x="458" y="28" text-anchor="middle">cez medzeru v endoteli</text>

<!-- 5 chemotaxia -->
<circle class="cellm" cx="548" cy="180" r="14"/><circle class="nucm" cx="548" cy="180" r="6"/>
<path class="arw" d="M566,184 L640,198" marker-end="url(#mfigleukkaskada)"/>
<circle class="dot" cx="656" cy="196" r="3"/><circle class="dot" cx="668" cy="204" r="3"/><circle class="dot" cx="660" cy="212" r="3"/><circle class="dot" cx="676" cy="194" r="3"/><circle class="dot" cx="680" cy="210" r="3"/>
<text class="sub" x="668" y="228" text-anchor="middle">baktérie</text>
<text class="lblb" x="624" y="16" text-anchor="middle">5. chemotaxia</text>
<text class="sub" x="624" y="28" text-anchor="middle">za C5a, IL-8, LTB₄</text>

<!-- signály pod endotelom -->
<text class="sub" x="190" y="158" text-anchor="middle">TNF, IL-1, histamín →</text>
<text class="sub" x="190" y="170" text-anchor="middle">endotel vystaví selektíny</text>
<text class="sub" x="330" y="158" text-anchor="middle">chemokíny na endoteli →</text>
<text class="sub" x="330" y="170" text-anchor="middle">integríny do vysokej afinity</text>
<text class="sub" x="436" y="196" text-anchor="middle">kolagenáza naruší</text>
<text class="sub" x="436" y="208" text-anchor="middle">bazálnu membránu</text>

<text class="lbl-m" x="250" y="200" text-anchor="middle">LAD: chýba integrín alebo ligand selektínov</text>
<text class="sub" x="250" y="213" text-anchor="middle">→ leukocyt ostane v krvi, v tkanive nie je hnis</text>
<text class="sub" x="360" y="256" text-anchor="middle">Každý krok spúšťa iný signál – preto sa leukocyt zastaví len pri ložisku.</text>
</svg>
