<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-labelledby="t26">
<title id="t26">Interstícium: kapilára, medzibunková hmota s bunkami a lymfatická cieva</title>
<defs><marker id="a26" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mk"/></marker></defs>

<!-- kapilára -->
<rect x="24" y="26" width="64" height="248" rx="30" fill="var(--color-accent-2-100)" stroke="var(--color-accent-2-600)" stroke-width="2"/>
<g class="fill-acc2"><ellipse cx="56" cy="70" rx="14" ry="8"/><ellipse cx="50" cy="120" rx="14" ry="8"/><ellipse cx="60" cy="172" rx="14" ry="8"/><ellipse cx="52" cy="224" rx="14" ry="8"/></g>
<text class="lblb" x="56" y="292" text-anchor="middle">kapilára</text>

<!-- lymfatická cieva -->
<path d="M640,26 L690,26 L690,274 L640,274 Z" fill="var(--color-accent-100)" stroke="var(--color-accent-600)" stroke-width="2" stroke-dasharray="7 4"/>
<text class="lblb" x="665" y="292" text-anchor="middle">lymfatická cieva</text>

<!-- matrix: kolagén -->
<path class="stk-n" style="stroke:var(--color-process-yellow);stroke-width:3" d="M130,60 C220,90 260,40 360,80 S520,60 610,90"/>
<path class="stk-n" style="stroke:var(--color-process-yellow);stroke-width:3" d="M130,150 C210,130 270,180 370,150 S520,170 610,140"/>
<path class="stk-n" style="stroke:var(--color-process-yellow);stroke-width:3" d="M130,238 C230,260 270,210 380,236 S520,220 610,250"/>
<!-- hyaluronan / proteoglykány -->
<path class="stk-acc" d="M180,110 c10,-14 24,-14 30,0 c6,14 -10,20 -16,8 c-6,-12 10,-20 20,-8"/>
<path class="stk-acc" d="M440,110 c10,-14 24,-14 30,0 c6,14 -10,20 -16,8 c-6,-12 10,-20 20,-8"/>
<path class="stk-acc" d="M300,206 c10,-14 24,-14 30,0 c6,14 -10,20 -16,8 c-6,-12 10,-20 20,-8"/>
<!-- fibroblast -->
<ellipse class="cellm" cx="300" cy="120" rx="46" ry="14" transform="rotate(-14 300 120)"/><ellipse class="nucm" cx="300" cy="120" rx="12" ry="6" transform="rotate(-14 300 120)"/>
<!-- makrofág -->
<circle class="cell" cx="500" cy="190" r="26"/><circle class="nuc" cx="500" cy="190" r="10"/>
<path class="stk-acc" d="M474,178 l-14,-8 M526,178 l14,-8 M474,204 l-14,8 M526,204 l14,8"/>

<!-- šípky toku -->
<path class="arw" d="M96,150 L126,150" marker-end="url(#a26)"/>
<text class="sub" x="111" y="140" text-anchor="middle">tekutina,</text><text class="sub" x="111" y="170" text-anchor="middle">O₂, živiny</text>
<path class="arw" d="M614,150 L636,150" marker-end="url(#a26)"/>

<!-- popisky -->
<text class="lbl" x="230" y="34">kolagén</text>
<text class="lbl" x="330" y="146" text-anchor="start">fibroblast</text>
<text class="lbl" x="508" y="234">makrofág</text>
<text class="lbl" x="150" y="96">hyaluronan,</text><text class="lbl" x="150" y="108">proteoglykány</text>
</svg>
