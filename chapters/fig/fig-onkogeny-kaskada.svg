<title id="tfigonkogenykaskada">Signálna reťaz od rastového faktora k deleniu bunky: rastový faktor, receptor s tyrozínkinázou, RAS, kaskáda RAF, MEK, ERK, jadrové transkripčné faktory MYC, cyklín D s CDK4, fosforylácia RB a uvoľnenie E2F, vstup do S-fázy; vľavo onkogény, ktoré jednotlivé články zapnú natrvalo, vpravo supresorové gény, ktoré ich brzdia – NF1, PTEN, p16, RB a p53 s p21; BCL2 chráni bunku pred apoptózou, ktorú p53 spúšťa</title>
<defs>
<marker id="mfigonkogenykaskada" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mk"/></marker>
<marker id="tfigonkogenykaskadainh" viewBox="0 0 4 12" refX="3" refY="6" markerWidth="4" markerHeight="12" orient="auto"><rect x="1" y="0" width="2.4" height="12" class="mk"/></marker>
</defs>

<text class="cap" x="140" y="14" text-anchor="middle">ONKOGÉN – ČÍM SA ZAPNE</text>
<text class="cap" x="360" y="14" text-anchor="middle">NORMÁLNA REŤAZ</text>
<text class="cap" x="600" y="14" text-anchor="middle">SUPRESOR – ČO BRZDÍ</text>

<rect class="bx-c" x="285" y="24" width="150" height="30" rx="3"/>
<text class="lblb" x="360" y="43" text-anchor="middle">rastový faktor</text>
<rect class="bx-c" x="285" y="72" width="150" height="30" rx="3"/>
<text class="lblb" x="360" y="91" text-anchor="middle">receptor (tyrozínkináza)</text>
<rect class="bx-c" x="285" y="120" width="150" height="30" rx="3"/>
<text class="lblb" x="360" y="139" text-anchor="middle">RAS (zapnutý s GTP)</text>
<rect class="bx-c" x="285" y="168" width="150" height="30" rx="3"/>
<text class="lblb" x="360" y="187" text-anchor="middle">RAF → MEK → ERK</text>
<rect class="bx-c" x="285" y="216" width="150" height="30" rx="3"/>
<text class="lblb" x="360" y="235" text-anchor="middle">MYC, FOS, JUN (jadro)</text>
<rect class="bx-c" x="285" y="264" width="150" height="30" rx="3"/>
<text class="lblb" x="360" y="283" text-anchor="middle">cyklín D + CDK4</text>
<rect class="bx-c" x="285" y="312" width="150" height="30" rx="3"/>
<text class="lblb" x="360" y="331" text-anchor="middle">E2F uvoľnený z RB</text>
<rect class="bx-k" x="285" y="362" width="150" height="30" rx="3" stroke="var(--color-accent-600)"/>
<text class="lblb" x="360" y="381" text-anchor="middle">S-fáza → delenie</text>

<path class="arw" d="M360,54 L360,70" marker-end="url(#mfigonkogenykaskada)"/>
<path class="arw" d="M360,102 L360,118" marker-end="url(#mfigonkogenykaskada)"/>
<path class="arw" d="M360,150 L360,166" marker-end="url(#mfigonkogenykaskada)"/>
<path class="arw" d="M360,198 L360,214" marker-end="url(#mfigonkogenykaskada)"/>
<path class="arw" d="M360,246 L360,262" marker-end="url(#mfigonkogenykaskada)"/>
<path class="arw" d="M360,294 L360,310" marker-end="url(#mfigonkogenykaskada)"/>
<path class="arw" d="M360,342 L360,360" marker-end="url(#mfigonkogenykaskada)"/>

<!-- vetva PI3K -->
<rect class="bx-c" x="452" y="168" width="96" height="30" rx="3"/>
<text class="sub" x="500" y="181" text-anchor="middle">PI3K → AKT</text>
<text class="sub" x="500" y="193" text-anchor="middle">→ mTOR (rast)</text>
<path class="arw" d="M435,92 C470,100 495,130 498,166" marker-end="url(#mfigonkogenykaskada)"/>

<!-- onkogény vľavo -->
<text class="sub" x="272" y="36" text-anchor="end">SIS (PDGF-B): nádor si tvorí faktor sám</text>
<text class="sub" x="272" y="48" text-anchor="end">– autokrinná slučka (glioblastóm)</text>
<text class="sub" x="272" y="84" text-anchor="end"><tspan font-weight="600">HER2</tspan> amplifikácia (prsník), <tspan font-weight="600">EGFR</tspan> mutácia</text>
<text class="sub" x="272" y="96" text-anchor="end">(pľúca), <tspan font-weight="600">KIT</tspan> (GIST), <tspan font-weight="600">RET</tspan> (štítna žľaza)</text>
<text class="sub" x="272" y="132" text-anchor="end"><tspan font-weight="600">KRAS</tspan> mutácia – GTP sa neštiepi,</text>
<text class="sub" x="272" y="144" text-anchor="end">RAS ostáva zapnutý (črevo, pankreas)</text>
<text class="sub" x="272" y="180" text-anchor="end"><tspan font-weight="600">BRAF</tspan> mutácia (melanóm);</text>
<text class="sub" x="272" y="192" text-anchor="end"><tspan font-weight="600">BCR::ABL1</tspan> t(9;22) – stála kináza (CML)</text>
<text class="sub" x="272" y="228" text-anchor="end"><tspan font-weight="600">MYC</tspan> t(8;14) (Burkittov lymfóm),</text>
<text class="sub" x="272" y="240" text-anchor="end"><tspan font-weight="600">NMYC</tspan> amplifikácia (neuroblastóm)</text>
<text class="sub" x="272" y="276" text-anchor="end"><tspan font-weight="600">CCND1</tspan> t(11;14) (lymfóm z plášťa),</text>
<text class="sub" x="272" y="288" text-anchor="end"><tspan font-weight="600">CDK4</tspan> amplifikácia (melanóm)</text>
<text class="sub" x="272" y="324" text-anchor="end">vírusový <tspan font-weight="600">E7</tspan> (HPV) viaže RB</text>
<text class="sub" x="272" y="336" text-anchor="end">a uvoľní E2F</text>

<!-- supresory vpravo -->
<rect class="bx-m" x="566" y="120" width="70" height="30" rx="3"/>
<text class="lblb" x="601" y="139" text-anchor="middle">NF1</text>
<path class="arw" d="M566,135 L437,135" marker-end="url(#tfigonkogenykaskadainh)"/>
<text class="sub" x="646" y="133" text-anchor="start">vypína RAS</text>
<text class="sub" x="646" y="145" text-anchor="start">(štiepi GTP)</text>

<rect class="bx-m" x="566" y="168" width="70" height="30" rx="3"/>
<text class="lblb" x="601" y="187" text-anchor="middle">PTEN</text>
<path class="arw" d="M566,183 L550,183" marker-end="url(#tfigonkogenykaskadainh)"/>
<text class="sub" x="646" y="181" text-anchor="start">brzdí</text>
<text class="sub" x="646" y="193" text-anchor="start">PI3K–AKT</text>

<rect class="bx-m" x="566" y="264" width="70" height="30" rx="3"/>
<text class="lblb" x="601" y="283" text-anchor="middle">p16</text>
<path class="arw" d="M566,279 L437,279" marker-end="url(#tfigonkogenykaskadainh)"/>
<text class="sub" x="646" y="277" text-anchor="start">inhibítor CDK4</text>
<text class="sub" x="646" y="289" text-anchor="start">(gén CDKN2A)</text>

<rect class="bx-m" x="566" y="312" width="70" height="30" rx="3"/>
<text class="lblb" x="601" y="331" text-anchor="middle">RB</text>
<path class="arw" d="M566,327 L437,327" marker-end="url(#tfigonkogenykaskadainh)"/>
<text class="sub" x="646" y="331" text-anchor="start">drží E2F</text>

<rect class="bx-m" x="566" y="206" width="70" height="30" rx="3"/>
<text class="lblb" x="601" y="225" text-anchor="middle">p53</text>
<text class="sub" x="646" y="213" text-anchor="start">pri poškodení DNA</text>
<path class="arw" d="M601,236 L601,252 L545,252 L545,276" marker-end="url(#mfigonkogenykaskada)"/>
<text class="sub" x="550" y="248" text-anchor="end">p21 ⊣ CDK</text>
<path class="arw" d="M636,221 L742,221 L742,388 L715,388" marker-end="url(#mfigonkogenykaskada)"/>
<rect class="bx-k" x="600" y="374" width="112" height="28" rx="3"/>
<text class="lblb" x="656" y="392" text-anchor="middle">apoptóza</text>
<text class="sub" x="534" y="398" text-anchor="end">BCL2 (t(14;18)) ⊣</text>
<path class="arw" d="M538,394 L598,390" marker-end="url(#tfigonkogenykaskadainh)"/>
</svg>
