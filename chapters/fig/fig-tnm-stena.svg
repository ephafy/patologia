<title id="tfigtnmstena">Systém TNM na príklade hrubého čreva: kategória T podľa hĺbky prerastania stenou – Tis v sliznici nad muscularis mucosae, T1 v podslizničnom väzive, T2 vo svalovine, T3 cez svalovinu do podseróznych tkanív, T4 cez serózu alebo do susedného orgánu; kategória N podľa počtu postihnutých regionálnych uzlín a kategória M podľa vzdialených metastáz</title>
<defs><marker id="mfigtnmstena" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mk"/></marker></defs>

<text class="cap" x="190" y="14" text-anchor="middle">T – HĹBKA PRERASTANIA STENOU ČREVA</text>
<text class="sub" x="40" y="34">lúmen čreva</text>

<rect class="zone-i" x="40" y="40" width="300" height="38"/>
