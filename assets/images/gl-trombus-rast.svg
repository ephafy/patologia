<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" width="640" height="300" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title>Trombus v priereze cievy: od poškodeného endotelu po uzáver priesvitu</title>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#6b6764"/>
    </marker>
    <!-- vrstvenie trombu: bledé pruhy doštičiek a fibrínu, tmavé erytrocyty -->
    <pattern id="vrstvy" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(28)">
      <rect width="10" height="10" fill="#b23a48"/>
      <rect width="10" height="3.2" fill="#ead8c8"/>
    </pattern>
    <!-- jeden prierez: stena, endotel, priesvit -->
    <g id="c">
      <circle r="62" fill="#f1d7d9" stroke="#c78b92" stroke-width="2"/>
      <circle r="44" fill="#fbeeee" stroke="#e7b9bf" stroke-width="1"/>
      <circle r="41" fill="#d9475a"/>
    </g>
  </defs>
  <rect width="640" height="300" fill="#fff"/>
  <text x="18" y="28" font-size="12.5" fill="#6b6764">prierez cievou – trombus rastie po vrstvách, až kým priesvit neuzavrie</text>

  <!-- 1 · poškodený endotel, prvé doštičky -->
  <use href="#c" x="85" y="130"/>
  <path d="M66 166 a41 41 0 0 0 38 0" fill="none" stroke="#7a5230" stroke-width="3.2"/>
  <g fill="#ead8c8" stroke="#b49a7e" stroke-width=".8">
    <ellipse cx="76" cy="161" rx="5" ry="3"/><ellipse cx="86" cy="163" rx="5" ry="3"/><ellipse cx="96" cy="160" rx="4.5" ry="3"/>
  </g>

  <!-- 2 · nástenný trombus: kosák pri stene, krv tečie okolo -->
  <use href="#c" x="240" y="130"/>
  <circle cx="240" cy="130" r="41" fill="url(#vrstvy)"/>
  <circle cx="240" cy="121" r="32" fill="#d9475a"/>

  <!-- 3 · trombus zúži priesvit na malý zvyšok -->
  <use href="#c" x="395" y="130"/>
  <circle cx="395" cy="130" r="41" fill="url(#vrstvy)"/>
  <circle cx="395" cy="105" r="14" fill="#d9475a"/>

  <!-- 4 · obturujúci trombus -->
  <use href="#c" x="550" y="130"/>
  <circle cx="550" cy="130" r="41" fill="url(#vrstvy)"/>

  <!-- obrys priesvitu -->
  <g fill="none" stroke="#8c2a36" stroke-width="1">
    <circle cx="240" cy="130" r="41"/><circle cx="395" cy="130" r="41"/><circle cx="550" cy="130" r="41"/>
  </g>

  <!-- šípky času -->
  <g stroke="#6b6764" stroke-width="1.6" fill="none" marker-end="url(#ar)">
    <path d="M152 130h18"/><path d="M307 130h18"/><path d="M462 130h18"/>
  </g>

  <!-- popisky -->
  <g font-size="13" font-weight="700" fill="#201e1d" text-anchor="middle">
    <text x="85" y="216">1 · poškodený endotel</text>
    <text x="240" y="216">2 · nástenný trombus</text>
    <text x="395" y="216">3 · priesvit sa zužuje</text>
    <text x="550" y="216">4 · uzáver</text>
  </g>
  <g font-size="11.5" fill="#55505a" text-anchor="middle">
    <text x="85" y="234">doštičky sa prichytia</text>
    <text x="85" y="249">na odkrytý kolagén</text>
    <text x="240" y="234">krv tečie okolo,</text>
    <text x="240" y="249">trombus rastie vo vrstvách</text>
    <text x="395" y="234">prúd sa spomalí,</text>
    <text x="395" y="249">tkanivu chýba krv</text>
    <text x="550" y="234">obturujúci trombus –</text>
    <text x="550" y="249">v tepne hrozí infarkt</text>
  </g>

  <!-- legenda -->
  <g font-size="11.5" fill="#55505a">
    <rect x="18" y="272" width="14" height="10" fill="#d9475a"/><text x="38" y="281">prúdiaca krv</text>
    <rect x="128" y="272" width="14" height="10" fill="url(#vrstvy)"/><text x="148" y="281">trombus: bledé vrstvy doštičiek a fibrínu, tmavé erytrocyty</text>
    <rect x="496" y="272" width="14" height="10" fill="#f1d7d9" stroke="#c78b92"/><text x="516" y="281">stena cievy</text>
  </g>
</svg>
