<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title>Ako sa doštičky prichytia a zhluknú: receptory GP Ib, GP VI a GP IIb/IIIa</title>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#a1305a"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#9a958f"/>
    </marker>
    <radialGradient id="plt" cx="45%" cy="40%" r="65%">
      <stop offset="0" stop-color="#e6ddfa"/>
      <stop offset="1" stop-color="#b9a7e6"/>
    </radialGradient>
    <radialGradient id="plt0" cx="45%" cy="40%" r="65%">
      <stop offset="0" stop-color="#f4f0fc"/>
      <stop offset="1" stop-color="#d7cdf0"/>
    </radialGradient>
  </defs>
  <rect width="640" height="400" fill="#fff"/>

  <!-- hlavička: tri kroky v rovnako širokých štítkoch, symetricky na stred -->
  <g font-size="12.5" fill="#201e1d">
    <rect x="52" y="12" width="168" height="28" rx="14" fill="#efeaf8"/>
    <circle cx="70" cy="26" r="9" fill="#5f42a8"/><text x="70" y="30" font-size="10.5" font-weight="700" fill="#fff" text-anchor="middle">1</text>
    <text x="146" y="30" text-anchor="middle">adhézia – prichytenie</text>
    <rect x="236" y="12" width="168" height="28" rx="14" fill="#fbe9ef"/>
    <circle cx="254" cy="26" r="9" fill="#cf4a72"/><text x="254" y="30" font-size="10.5" font-weight="700" fill="#fff" text-anchor="middle">2</text>
    <text x="330" y="30" text-anchor="middle">aktivácia – signál</text>
    <rect x="420" y="12" width="168" height="28" rx="14" fill="#e6f3ec"/>
    <circle cx="438" cy="26" r="9" fill="#2c8a5a"/><text x="438" y="30" font-size="10.5" font-weight="700" fill="#fff" text-anchor="middle">3</text>
    <text x="514" y="30" text-anchor="middle">agregácia – zhluk</text>
  </g>

  <g transform="translate(0 40)">
  <!-- priesvit cievy: smer prúdu krvi -->
  <text x="18" y="30" font-size="12" fill="#6b6764">krv prúdi priesvitom cievy</text>
  <path d="M168 26h56" stroke="#9a958f" stroke-width="1.5" marker-end="url(#ag)"/>

  <!-- stena: endotel vľavo a vpravo, v strede poranenie s odkrytým kolagénom -->
  <rect x="0" y="262" width="640" height="98" fill="#f6e3e6"/>
  <g fill="#fbf6ee" stroke="#c9b9a8" stroke-width="1.2">
    <rect x="-6" y="246" width="96" height="18" rx="9"/>
    <rect x="94" y="246" width="70" height="18" rx="9"/>
    <rect x="494" y="246" width="96" height="18" rx="9"/>
    <rect x="594" y="246" width="60" height="18" rx="9"/>
  </g>
  <text x="18" y="240" font-size="12" fill="#6b6764">endotel</text>
  <text x="530" y="240" font-size="12" fill="#6b6764">endotel</text>
  <g fill="none" stroke="#c98a5a" stroke-width="2.4" stroke-linecap="round">
    <path d="M150 300c30-14 60 14 90 0s60 14 90 0 60 14 90 0 60 14 90 0"/>
    <path d="M120 322c30-14 60 14 90 0s60 14 90 0 60 14 90 0 60 14 90 0 60 14 90 0"/>
    <path d="M170 280c30-12 60 12 90 0s60 12 90 0 60 12 90 0 50 10 60 4"/>
  </g>
  <text x="320" y="350" font-size="12.5" fill="#8a4f28" text-anchor="middle">odkrytý kolagén pod porušeným endotelom</text>

  <!-- neaktívna doštička v prúde -->
  <ellipse cx="92" cy="106" rx="40" ry="15" fill="url(#plt0)" stroke="#a99ad0" stroke-width="1.4"/>
  <path d="M92 121v8" stroke="#a99ad0" stroke-width="2.6" stroke-linecap="round"/>
  <path d="M86 131h12" stroke="#a99ad0" stroke-width="2.6" stroke-linecap="round"/>
  <text x="92" y="80" font-size="12" fill="#6b6764" text-anchor="middle">pokojová doštička</text>
  <text x="92" y="150" font-size="11.5" fill="#6b6764" text-anchor="middle">GP IIb/IIIa zatvorený –</text>
  <text x="92" y="164" font-size="11.5" fill="#6b6764" text-anchor="middle">fibrinogén neviaže</text>

  <!-- 1 · adhézia: doštička na kolagéne cez vWF (GP Ib) a priamo (GP VI) -->
  <path d="M215 248c-12-6-14-22-2-30 10-18 40-22 62-20 26 2 52 0 74 8 18 6 22 26 8 36-6 10-28 12-52 12-30 0-66 4-90-6z" fill="url(#plt)" stroke="#7a62c4" stroke-width="1.6"/>
  <text x="285" y="240" font-size="12" fill="#3d2a7a" text-anchor="middle">aktivovaná doštička</text>
  <path d="M176 300c-4-14 10-18 4-30s8-16 4-26 6-8 16-6" fill="none" stroke="#2f7fb8" stroke-width="3" stroke-linecap="round"/>
  <circle cx="202" cy="236" r="5.5" fill="#fff" stroke="#2f7fb8" stroke-width="2"/>
  <path d="M207 237l10 2" stroke="#5f42a8" stroke-width="3" stroke-linecap="round"/>
  <text x="136" y="276" font-size="13" font-weight="700" fill="#2f7fb8">vWF</text>
  <text x="150" y="222" font-size="13" font-weight="700" fill="#5f42a8">GP Ib</text>
  <circle cx="160" cy="296" r="9" fill="#5f42a8"/><text x="160" y="300" font-size="10.5" font-weight="700" fill="#fff" text-anchor="middle">1</text>
  <path d="M332 256v18" stroke="#5f42a8" stroke-width="3" stroke-linecap="round"/>
  <path d="M326 278h12" stroke="#5f42a8" stroke-width="3" stroke-linecap="round"/>
  <g stroke="#f6e3e6" stroke-width="4" paint-order="stroke" stroke-linejoin="round">
    <text x="346" y="284" font-size="12.5" font-weight="700" fill="#5f42a8">GP VI</text>
    <text x="346" y="298" font-size="11.5" fill="#55505a">viaže sa na kolagén sám,</text>
    <text x="346" y="311" font-size="11.5" fill="#55505a">bez sprostredkovania vWF</text>
  </g>

  <!-- 2 · aktivácia: granuly vysypú ADP, vzniká TXA₂ -->
  <g fill="#cf4a72"><circle cx="258" cy="224" r="3"/><circle cx="274" cy="219" r="2.6"/><circle cx="296" cy="223" r="3"/></g>
  <circle cx="400" cy="214" r="9" fill="#cf4a72"/><text x="400" y="218" font-size="10.5" font-weight="700" fill="#fff" text-anchor="middle">2</text>
  <text x="414" y="212" font-size="12" fill="#a1305a">ADP, tromboxán A₂</text>
  <text x="414" y="226" font-size="11.5" fill="#55505a">aktivujú ďalšie doštičky</text>
  <path d="M556 210C590 200 596 150 550 124" fill="none" stroke="#cf4a72" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#ar)"/>

  <!-- 3 · agregácia: fibrinogén spája receptory GP IIb/IIIa oboch doštičiek -->
  <path d="M410 116c-10-6-10-22 2-28 12-14 40-16 62-14 24 2 44 4 56 14 12 10 6 26-8 30-12 8-36 8-58 8-24 0-42-2-54-10z" fill="url(#plt)" stroke="#7a62c4" stroke-width="1.6"/>
  <text x="470" y="102" font-size="12" fill="#3d2a7a" text-anchor="middle">aktivovaná doštička</text>
  <path d="M318 206v-14" stroke="#5f42a8" stroke-width="3" stroke-linecap="round"/>
  <path d="M312 190h12" stroke="#5f42a8" stroke-width="3" stroke-linecap="round"/>
  <path d="M440 128v12" stroke="#5f42a8" stroke-width="3" stroke-linecap="round"/>
  <path d="M434 142h12" stroke="#5f42a8" stroke-width="3" stroke-linecap="round"/>
  <path d="M320 186L438 146" stroke="#2c8a5a" stroke-width="3.2" stroke-linecap="round"/>
  <circle cx="330" cy="183" r="6" fill="#2c8a5a"/><circle cx="379" cy="166" r="5" fill="#2c8a5a"/><circle cx="428" cy="149" r="6" fill="#2c8a5a"/>
  <circle cx="190" cy="120" r="9" fill="#2c8a5a"/><text x="190" y="124" font-size="10.5" font-weight="700" fill="#fff" text-anchor="middle">3</text>
  <text x="204" y="124" font-size="13" font-weight="700" fill="#2c8a5a">fibrinogén</text>
  <text x="204" y="138" font-size="11.5" fill="#55505a">spája GP IIb/IIIa oboch doštičiek</text>
  <!-- ten istý receptor na oboch doštičkách -->
  <text x="304" y="184" font-size="12" font-weight="700" fill="#5f42a8" text-anchor="end">GP IIb/IIIa</text>
  <text x="452" y="156" font-size="12" font-weight="700" fill="#5f42a8">GP IIb/IIIa</text>
  <text x="452" y="170" font-size="11.5" fill="#55505a">otvorený – viaže</text>
  <text x="452" y="184" font-size="11.5" fill="#55505a">fibrinogén</text>
  </g>
</svg>
