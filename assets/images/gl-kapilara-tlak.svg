<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" width="640" height="380" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title>Tlak v kapiláre pri voľnom a pri zablokovanom žilovom odtoku</title>
  <defs>
    <linearGradient id="norm" x1="0" x2="1">
      <stop offset="0" stop-color="#d9475a"/><stop offset="1" stop-color="#5a6fb8"/>
    </linearGradient>
    <linearGradient id="stop" x1="0" x2="1">
      <stop offset="0" stop-color="#c8384c"/><stop offset="1" stop-color="#9a3a7a"/>
    </linearGradient>
    <marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2f7fb8"/></marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#55505a"/></marker>
  </defs>
  <rect width="640" height="380" fill="#fff"/>

  <!-- 1 · voľný odtok -->
  <text x="20" y="28" font-size="14" font-weight="700" fill="#201e1d">1 · odtok voľný – tlak pozdĺž kapiláry klesá</text>
  <text x="20" y="70" font-size="12" fill="#55505a">arteriola</text>
  <text x="588" y="70" font-size="12" fill="#55505a" text-anchor="end">venula</text>
  <rect x="80" y="78" width="480" height="30" rx="15" fill="url(#norm)"/>
  <path d="M120 93h400" stroke="#fff" stroke-width="2" stroke-dasharray="6 6" marker-end="url(#g)"/>
  <!-- filtrácia na začiatku, návrat na konci -->
  <g stroke="#2f7fb8" stroke-width="2" fill="none">
    <path d="M120 76v-18" marker-end="url(#o)"/><path d="M160 76v-14" marker-end="url(#o)"/>
    <path d="M200 76v-12" marker-end="url(#o)"/>
    <path d="M440 58v14" marker-end="url(#o)"/><path d="M480 56v16" marker-end="url(#o)"/><path d="M520 56v16" marker-end="url(#o)"/>
  </g>
  <text x="160" y="134" font-size="11.5" fill="#55505a" text-anchor="middle">tu vyteká trochu tekutiny</text>
  <text x="480" y="134" font-size="11.5" fill="#55505a" text-anchor="middle">tu sa väčšina vracia</text>
  <!-- graf tlaku -->
  <path d="M80 158L470 202" stroke="#c8384c" stroke-width="2.5" fill="none"/>
  <path d="M80 182H470" stroke="#2f7fb8" stroke-width="1.6" stroke-dasharray="5 4" fill="none"/>
  <text x="478" y="206" font-size="11" fill="#c8384c">tlak krvi v kapiláre</text>
  <text x="478" y="186" font-size="11" fill="#2f7fb8">onkotický tlak plazmy</text>

  <!-- 2 · zablokovaný odtok -->
  <text x="20" y="236" font-size="14" font-weight="700" fill="#201e1d">2 · odtok zablokovaný – tlak stúpne v celej kapiláre</text>
  <rect x="80" y="276" width="480" height="30" rx="15" fill="url(#stop)"/>
  <rect x="548" y="268" width="14" height="46" rx="3" fill="#55505a"/>
  <text x="590" y="296" font-size="12" fill="#55505a" text-anchor="middle">uzáver</text>
  <g stroke="#2f7fb8" stroke-width="2" fill="none">
    <path d="M120 274v-18" marker-end="url(#o)"/><path d="M180 274v-18" marker-end="url(#o)"/><path d="M240 274v-17" marker-end="url(#o)"/>
    <path d="M300 274v-17" marker-end="url(#o)"/><path d="M360 274v-16" marker-end="url(#o)"/><path d="M420 274v-16" marker-end="url(#o)"/>
    <path d="M480 274v-16" marker-end="url(#o)"/>
  </g>
  <g fill="#9cc6e6" opacity=".8"><circle cx="150" cy="248" r="4"/><circle cx="270" cy="244" r="5"/><circle cx="390" cy="247" r="4"/><circle cx="455" cy="243" r="5"/></g>
  <path d="M80 326L470 332" stroke="#c8384c" stroke-width="2.5" fill="none"/>
  <path d="M80 352H470" stroke="#2f7fb8" stroke-width="1.6" stroke-dasharray="5 4" fill="none"/>
  <text x="478" y="330" font-size="11" fill="#c8384c">tlak krvi v kapiláre</text><text x="478" y="355" font-size="11" fill="#2f7fb8">onkotický tlak plazmy</text><text x="20" y="374" font-size="11.5" fill="#55505a">krv nemá kam odtiecť → tlak sa vyrovná s tlakom na vstupe → všade prevýši onkotický tlak → tekutina len vyteká = opuch</text>
</svg>
